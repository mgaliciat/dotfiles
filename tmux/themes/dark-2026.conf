# ─── tmux palette: dark-2026 ────────────────────────────────────
# vim: ft=tmux
# Clone of "Dark 2026", VS Code's default dark theme (the 2026
# "Focus" refresh). PALETTE-ONLY: it only defines @thm_*; the structure
# (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/dark-2026 and nvim/lua/themes/dark-2026.lua.
# Hex taken from extensions/theme-defaults/themes/2026-dark.json in
# microsoft/vscode.

set -g @thm_bg      "#121314"   # editor.background — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#242526"   # textCodeBlock/hover background — message / selection bg
set -g @thm_fg      "#bbbebf"   # editor.foreground
set -g @thm_dim     "#8c8c8c"   # descriptionForeground — dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#2a2b2c"   # editorWidget.border — separators │, inactive, borders
set -g @thm_accent  "#3994bc"   # menu.selectionBorder — session id, time, active pane
set -g @thm_active  "#cca700"   # notificationsWarningIcon — active window
set -g @thm_blue    "#48a0c7"   # textLink.foreground — inactive display-panes
