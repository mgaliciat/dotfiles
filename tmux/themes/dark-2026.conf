# ─── tmux palette: dark-2026 ────────────────────────────────────
# vim: ft=tmux
# Clon de "Dark 2026", el theme oscuro por default de VS Code (refresh
# "Focus" de 2026). PALETTE-ONLY: solo define @thm_*; la estructura
# (statusline.conf / theme.conf) los consume con `set -gF`.
#
# Espejo de ghostty/themes/dark-2026 y nvim/lua/themes/dark-2026.lua.
# Hex sacados de extensions/theme-defaults/themes/2026-dark.json en
# microsoft/vscode.

set -g @thm_bg      "#121314"   # editor.background — = terminal bg, la barra se mezcla
set -g @thm_bg_sel  "#242526"   # textCodeBlock/hover background — bg de mensajes / selección
set -g @thm_fg      "#bbbebf"   # editor.foreground
set -g @thm_dim     "#8c8c8c"   # descriptionForeground — fg apagado pero legible (whoami/host)
set -g @thm_subtle  "#2a2b2c"   # editorWidget.border — separadores │, inactivos, borders
set -g @thm_accent  "#3994bc"   # menu.selectionBorder — session id, hora, pane activo
set -g @thm_active  "#cca700"   # notificationsWarningIcon — window activa
set -g @thm_blue    "#48a0c7"   # textLink.foreground — display-panes inactivos
