# ─── tmux palette: typesafe ────────────────────────────────────
# vim: ft=tmux
# The sage canvas of typesafe.ai + black text. PALETTE-ONLY: it only
# defines @thm_*; the structure (statusline.conf / theme.conf) consumes them
# with `set -gF`.
#
# Mirror of ghostty/themes/typesafe and nvim/lua/themes/typesafe.lua. The
# canvas is the page's `rgb(171,186,185)` at 89%, the text its #000 token;
# the rest is derived on the page's hues, see the ghostty file. The page's
# teal #09aea1 is the accent in Ghostty (cursor) and nvim (borders) but here
# it would also be TEXT — session id, clock — at 1.2:1 over the canvas, so
# tmux takes the darkened teal that ANSI 6 uses.

set -g @thm_bg      "#98a6a5"   # page canvas at 89% — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#849090"   # canvas at 87% — message / selection bg
set -g @thm_fg      "#000000"   # black text, the page's #000 token
set -g @thm_dim     "#3f4b4a"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#7d8c8b"   # separators │, inactive, borders
set -g @thm_accent  "#055c55"   # teal, darkened to read as text — session id, time, active pane
set -g @thm_active  "#8e2b76"   # magenta (page #d45bb6, darkened) — active window
set -g @thm_blue    "#1b567f"   # derived blue — inactive display-panes
set -g @thm_popup   "#000000"   # popup frame + title — subtle gray reads at 1.4:1 here, black at 8.3:1
