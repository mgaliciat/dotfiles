# ─── tmux palette: typesafe ────────────────────────────────────
# vim: ft=tmux
# The sage canvas of typesafe.ai + near-black ink. PALETTE-ONLY: it only
# defines @thm_*; the structure (statusline.conf / theme.conf) consumes them
# with `set -gF`.
#
# Mirror of ghostty/themes/typesafe and nvim/lua/themes/typesafe.lua. The
# canvas is the page's own CSS (`html body { background: rgb(171,186,185) }`);
# the rest is tuned to it in OKLCH, the page's tokens giving only the hues —
# see the ghostty file. The page's teal #09aea1 is the accent in Ghostty
# (cursor) and nvim (borders) but here it would also be TEXT — session id,
# clock — at 1.4:1 over the canvas, so tmux takes ANSI 6 as tuned there.

set -g @thm_bg      "#abbab9"   # page canvas — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#94a4a3"   # ladder two steps down — message / selection bg
set -g @thm_fg      "#0a1110"   # sage-tinted near-black
set -g @thm_dim     "#303a3a"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#697877"   # separators │, inactive, borders
set -g @thm_accent  "#065d55"   # ANSI 6, the page's teal hue at text L — session id, time, active pane
set -g @thm_active  "#80246c"   # ANSI 5, the page's magenta hue — active window
set -g @thm_blue    "#005581"   # ANSI 4 — inactive display-panes
set -g @thm_popup   "#0a1110"   # popup frame + title — subtle gray reads at 2.3:1 here, the fg at 9.5:1
