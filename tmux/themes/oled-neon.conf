# ─── tmux palette: oled-neon ──────────────────────────────────
# vim: ft=tmux
# True black (#000) + neón Dracula. PALETTE-ONLY: solo define @thm_*;
# la estructura los consume con `set -gF`.
#
# Espejo de ghostty/themes/oled-neon y nvim/lua/themes/oled-neon.lua.

set -g @thm_bg      "#000000"   # true black OLED
set -g @thm_bg_sel  "#2a2a4a"   # azul-violeta oscuro — bg de mensajes / selección
set -g @thm_fg      "#f8f8f2"   # Dracula fg
set -g @thm_dim     "#bfbfbf"   # gris claro (whoami/host)
set -g @thm_subtle  "#4a4a4a"   # bright_black — separadores │, inactivos
set -g @thm_accent  "#50fa7b"   # verde láser — acento principal (cursor del theme)
set -g @thm_active  "#ff79c6"   # magenta neón — window activa
set -g @thm_blue    "#8be9fd"   # cyan brillante — display-panes (vibra sobre #000)
