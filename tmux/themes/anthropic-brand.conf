# ─── tmux palette: anthropic-brand ───────────────────────────
# vim: ft=tmux
# The seven official Anthropic brand colours. PALETTE-ONLY: it only defines
# @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/anthropic-brand and nvim/lua/themes/anthropic-brand.lua
# — that ghostty file carries the derivation rationale and the upstream link.

set -g @thm_bg      "#141413"   # BRAND Dark
set -g @thm_bg_sel  "#472d24"   # deep desaturated Orange — message / selection bg
set -g @thm_fg      "#e8e6dc"   # BRAND Light Gray
set -g @thm_dim     "#b0aea5"   # BRAND Mid Gray — whoami/host
set -g @thm_subtle  "#727064"   # separators │, inactive
set -g @thm_accent  "#d97757"   # BRAND Orange — primary accent
# Active window takes the SECONDARY accent rather than an amber: with Orange
# already on the session name, the two would sit side by side in the same status
# line and blur into one segment.
set -g @thm_active  "#6a9bcc"   # BRAND Blue
set -g @thm_blue    "#92b8dd"   # Blue lifted — inactive display-panes
