# ─── tmux palette: typesafe-dark ───────────────────────────────
# vim: ft=tmux
# The sage of typesafe.ai taken down to a night canvas. PALETTE-ONLY: it only
# defines @thm_*; the structure (statusline.conf / theme.conf) consumes them
# with `set -gF`.
#
# Mirror of ghostty/themes/typesafe-dark and nvim/lua/themes/typesafe-dark.lua;
# dark companion of typesafe.conf. The canvas is derived (same sage hue, 11%
# lightness); the accents are the page's own tokens verbatim, because over this
# canvas they read as TEXT (teal 5.9:1, magenta 4.6:1) — the light theme had
# to darken them. No @thm_popup: the subtle gray clears 3:1 here, so the
# theme.conf fallback is the right frame.

set -g @thm_bg      "#182221"   # derived night canvas — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#2c3a39"   # canvas two steps up — message / selection bg
set -g @thm_fg      "#dedede"   # the page's #dedede token
set -g @thm_dim     "#a9b5b4"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#5f6f6e"   # separators │, inactive, borders
set -g @thm_accent  "#09aea1"   # the page's teal, verbatim — session id, time, active pane
set -g @thm_active  "#d45bb6"   # the page's magenta, verbatim — active window
set -g @thm_blue    "#4d9fd6"   # derived blue — inactive display-panes
