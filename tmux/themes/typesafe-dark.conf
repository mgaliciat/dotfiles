# ─── tmux palette: typesafe-dark ───────────────────────────────
# vim: ft=tmux
# The sage of typesafe.ai taken down to a night canvas. PALETTE-ONLY: it only
# defines @thm_*; the structure (statusline.conf / theme.conf) consumes them
# with `set -gF`.
#
# Mirror of ghostty/themes/typesafe-dark and nvim/lua/themes/typesafe-dark.lua;
# dark companion of typesafe.conf. The canvas is derived (same sage hue, 11%
# lightness) and every other value is tuned to it in OKLCH — the page's tokens
# give the hues, lightness is equalised per role (see the ghostty file). The
# accent is ANSI 6 as tuned there, at 6.4:1 it reads as text (session id,
# clock), which the light theme's teal could not. No @thm_popup: the subtle
# gray clears 3:1 here, so the theme.conf fallback is the right frame.

set -g @thm_bg      "#182221"   # derived night canvas — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#2b3837"   # ladder two steps up — message / selection bg
set -g @thm_fg      "#d8e0df"   # sage-tinted white
set -g @thm_dim     "#a8b4b3"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#667574"   # separators │, inactive, borders (3.4:1)
set -g @thm_accent  "#17b6a8"   # ANSI 6, the page's teal hue — session id, time, active pane
set -g @thm_active  "#d977bf"   # ANSI 5, the page's magenta hue — active window
set -g @thm_blue    "#50a7e2"   # ANSI 4 — inactive display-panes
