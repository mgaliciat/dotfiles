# ─── tmux palette: carbon ──────────────────────────────────
# vim: ft=tmux
# Minimal true black (#000) + high-contrast, a single warm accent (Claude orange).
# PALETTE-ONLY: it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/carbon and nvim/lua/themes/carbon.lua.

set -g @thm_bg      "#000000"   # true black
set -g @thm_bg_sel  "#2a2a2a"   # neutral gray for selection / msg bg — no tint (minimal)
set -g @thm_fg      "#e4e4e4"   # crisp off-white
set -g @thm_dim     "#a0a0a0"   # dimmed gray (whoami/host)
set -g @thm_subtle  "#4a4a4a"   # bright_black — separators │, inactive
set -g @thm_accent  "#d97757"   # Claude orange — main accent (session, theme cursor)
set -g @thm_active  "#e4e4e4"   # active window stands out by brightness (white), stays minimal
set -g @thm_blue    "#7aa6c2"   # muted steel blue — display-panes
