# ─── tmux palette: carbon ──────────────────────────────────
# vim: ft=tmux
# True black (#000) minimal + high-contrast, un solo acento cálido (Claude orange).
# PALETTE-ONLY: solo define @thm_*; la estructura los consume con `set -gF`.
#
# Espejo de ghostty/themes/carbon y nvim/lua/themes/carbon.lua.

set -g @thm_bg      "#000000"   # true black
set -g @thm_bg_sel  "#2a2a2a"   # gris neutro para selección / msg bg — sin tinte (minimal)
set -g @thm_fg      "#e4e4e4"   # off-white nítido
set -g @thm_dim     "#a0a0a0"   # gris atenuado (whoami/host)
set -g @thm_subtle  "#4a4a4a"   # bright_black — separadores │, inactivos
set -g @thm_accent  "#d97757"   # Claude orange — acento principal (sesión, cursor del theme)
set -g @thm_active  "#e4e4e4"   # window activa resalta por brillo (blanco), mantiene minimal
set -g @thm_blue    "#7aa6c2"   # steel blue apagado — display-panes
