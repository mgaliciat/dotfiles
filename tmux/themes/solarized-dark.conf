# ─── tmux palette: solarized-dark ─────────────────────────────
# vim: ft=tmux
# Canonical Solarized Dark (the original, not the osaka fork). PALETTE-ONLY:
# it only defines @thm_*; the structure (statusline.conf / theme.conf)
# consumes them with `set -gF`.
#
# Mirror of ghostty/themes/solarized-dark and nvim/lua/themes/solarized-dark.lua.

set -g @thm_bg      "#002b36"   # base03 — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#073642"   # base02 — message / selection bg
set -g @thm_fg      "#839496"   # base0 — body text
set -g @thm_dim     "#93a1a1"   # base1 — emphasized fg (whoami/host)
set -g @thm_subtle  "#586e75"   # base01 — separators │, inactive, borders
set -g @thm_accent  "#268bd2"   # blue — session id, time, active pane
set -g @thm_active  "#b58900"   # yellow — active window
set -g @thm_blue    "#2aa198"   # cyan — inactive display-panes
