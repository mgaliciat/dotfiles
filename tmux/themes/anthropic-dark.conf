# ─── tmux palette: anthropic-dark ─────────────────────────────
# vim: ft=tmux
# Tinta Claude (brown-black) + naranja. PALETTE-ONLY: solo define
# @thm_*; la estructura los consume con `set -gF`.
#
# Espejo de ghostty/themes/anthropic-dark y nvim/lua/themes/anthropic-dark.lua.

set -g @thm_bg      "#141413"   # Anthropic ink
set -g @thm_bg_sel  "#2b2a27"   # bg inset — bg de mensajes / selección
set -g @thm_fg      "#eae7df"   # foreground
set -g @thm_dim     "#a9a39a"   # foregroundMuted (whoami/host)
set -g @thm_subtle  "#6b665f"   # neutral.charcoal — separadores │, inactivos
set -g @thm_accent  "#d97757"   # Claude orange — acento principal
set -g @thm_active  "#e8c96b"   # ámbar — window activa
set -g @thm_blue    "#61aaf2"   # info blue — display-panes inactivos
