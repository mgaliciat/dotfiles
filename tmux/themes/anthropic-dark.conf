# ─── tmux palette: anthropic-dark ─────────────────────────────
# vim: ft=tmux
# Claude ink (brown-black) + orange. PALETTE-ONLY: it only defines
# @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/anthropic-dark and nvim/lua/themes/anthropic-dark.lua.

set -g @thm_bg      "#141413"   # Anthropic ink
set -g @thm_bg_sel  "#2b2a27"   # bg inset — message / selection bg
set -g @thm_fg      "#eae7df"   # foreground
set -g @thm_dim     "#a9a39a"   # foregroundMuted (whoami/host)
set -g @thm_subtle  "#6b665f"   # neutral.charcoal — separators │, inactive
set -g @thm_accent  "#d97757"   # Claude orange — main accent
set -g @thm_active  "#e8c96b"   # amber — active window
set -g @thm_blue    "#61aaf2"   # info blue — inactive display-panes
