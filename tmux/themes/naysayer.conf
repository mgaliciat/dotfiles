# ─── tmux palette: naysayer ────────────────────────────────
# vim: ft=tmux
# Jonathan Blow's editor colors: deep teal bg, warm sand fg, green/teal syntax.
# PALETTE-ONLY: it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/naysayer and nvim/lua/themes/naysayer.lua.
# No upstream tmux theme exists (he doesn't use tmux) — this is our own semantic
# derivation, same as osaka's. Every hex is one of his slots, none invented.

set -g @thm_bg      "#052329"   # Background — deep teal, the theme's signature
set -g @thm_bg_sel  "#184d68"   # Margin_Hover — selection / msg bg (his Highlight #0010ff is a fg-selection colour, far too loud for a bar)
set -g @thm_fg      "#d0c0a0"   # Default — warm sand
set -g @thm_dim     "#a09880"   # Default, dimmed (whoami/host)
set -g @thm_subtle  "#46494d"   # Ghost_Character — separators │, inactive
set -g @thm_accent  "#d8b488"   # Bar — literally his statusline colour. Exact semantic match.
set -g @thm_active  "#20d0e0"   # Pop1 — his "make this stand out" slot
set -g @thm_blue    "#108090"   # Margin_Active — display-panes
