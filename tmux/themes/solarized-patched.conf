# ─── tmux palette: solarized-patched ──────────────────────────
# vim: ft=tmux
# The "Solarized Dark Patched" cut. PALETTE-ONLY: it only defines @thm_*;
# the structure (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/solarized-patched and
# nvim/lua/themes/solarized-patched.lua — that Ghostty file holds the provenance.
# NOT `solarized-dark`: every hex below differs from the canonical scheme.

set -g @thm_bg      "#001e27"   # patched canvas — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#002831"   # palette 0 — message / selection bg
set -g @thm_fg      "#708284"   # body text
set -g @thm_dim     "#819090"   # emphasized fg (whoami/host)
set -g @thm_subtle  "#475b62"   # separators │, inactive, borders
set -g @thm_accent  "#2176c7"   # blue — session id, time, active pane
set -g @thm_active  "#a57706"   # yellow — active window
set -g @thm_blue    "#259286"   # cyan — inactive display-panes

# Popup frame + `-T` title (theme.conf's optional role). Solarized orange.
#
# It is the colour craftzdog's config asks for and almost never gets. He writes
# `colour166` in three places, all inside the canonical "Solarized 256" tmux
# template he pastes verbatim into .config/tmux/theme.conf, where 166 is the
# degraded-palette index FOR Solarized orange, #cb4b16. Two of the three are dead
# on arrival: his statusline.conf is sourced after theme.conf and overrides both
# `message-style` and `pane-active-border-style` (with #eee8d5 cream), and his
# `window-status-current-format` paints every segment with an explicit #[fg=…].
# The only 166 that survives in his setup is `display-panes-colour`, the pane
# numbers under prefix+q. He styles no popup at all.
#
# Written as #cb4b16 rather than the index: 166 lands on that hex only in a
# terminal whose 256-colour table was remapped by Solarized's own dircolors.
# Ghostty defines slots 0-15 from the theme and leaves the rest at the xterm
# cube, where 166 is #d75f00 — brighter and more orange than the template means.
#
# Louder than the theme's own orange (#bd3613, palette 9) on purpose: the frame
# has to read at 90% width over a canvas it barely contrasts with.
set -g @thm_popup   "#cb4b16"   # popup frame + title — Solarized orange, his colour166
