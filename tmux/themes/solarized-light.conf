# ─── tmux palette: solarized-light ────────────────────────────
# vim: ft=tmux
# Solarized Light canónico. PALETTE-ONLY: solo define @thm_*; la
# estructura (statusline.conf / theme.conf) los consume con `set -gF`.
#
# Espejo de ghostty/themes/solarized-light y nvim/lua/themes/solarized-light.lua.

set -g @thm_bg      "#fdf6e3"   # base3 — = terminal bg, la barra se mezcla
set -g @thm_bg_sel  "#eee8d5"   # base2 — bg de mensajes / selección
set -g @thm_fg      "#657b83"   # base00 — body text
set -g @thm_dim     "#586e75"   # base01 — fg enfatizado (whoami/host)
set -g @thm_subtle  "#93a1a1"   # base1 — separadores │, inactivos, borders
set -g @thm_accent  "#268bd2"   # blue — session id, hora, pane activo
set -g @thm_active  "#b58900"   # yellow — window activa
set -g @thm_blue    "#2aa198"   # cyan — display-panes inactivos
