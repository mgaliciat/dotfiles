# ─── tmux palette: solarized-light ────────────────────────────
# vim: ft=tmux
# Canonical Solarized Light. PALETTE-ONLY: it only defines @thm_*; the
# structure (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/solarized-light and nvim/lua/themes/solarized-light.lua.

set -g @thm_bg      "#fdf6e3"   # base3 — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#eee8d5"   # base2 — message / selection bg
set -g @thm_fg      "#657b83"   # base00 — body text
set -g @thm_dim     "#586e75"   # base01 — emphasized fg (whoami/host)
set -g @thm_subtle  "#93a1a1"   # base1 — separators │, inactive, borders
set -g @thm_accent  "#268bd2"   # blue — session id, time, active pane
set -g @thm_active  "#b58900"   # yellow — active window
set -g @thm_blue    "#2aa198"   # cyan — inactive display-panes
