# ─── tmux palette: retta ───────────────────────────────────
# vim: ft=tmux
# Eclipse "Retta" port: true black + cream, pumpkin accent (high contrast).
# PALETTE-ONLY: it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/retta and nvim/lua/themes/retta.lua. Semantic
# derivation is ours (no upstream Retta tmux theme exists): hex comes from the
# Eclipse XML, the slot assignment follows the other tmux palettes.

set -g @thm_bg      "#000000"   # true black (Retta background)
set -g @thm_bg_sel  "#527d5d"   # Retta selectionBackground — same green Ghostty uses
set -g @thm_fg      "#f8e1aa"   # Retta foreground (cream)
set -g @thm_dim     "#c9b787"   # dimmed cream (whoami/host) — same derived as nvim fg_dark
set -g @thm_subtle  "#83786e"   # Retta comment gray — separators │, inactive
set -g @thm_accent  "#e79e3c"   # keyword pumpkin — main accent (session, theme cursor)
set -g @thm_active  "#fff6dc"   # active window stands out by brightness (bright cream)
set -g @thm_blue    "#a4b0c0"   # Retta method blue-gray — display-panes
