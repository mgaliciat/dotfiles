# ─── tmux palette: xray ────────────────────────────────────
# vim: ft=tmux
# The palette of Ghostty's `xray` dock icon: monochrome PCB, silver ghost,
# one cool "film blue" accent. Grays sampled from the icon itself.
# PALETTE-ONLY: it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/xray and nvim/lua/themes/xray.lua.

set -g @thm_bg      "#101010"   # the board — not true black (that's only the icon's frame)
set -g @thm_bg_sel  "#303030"   # trace gray for selection / msg bg — no tint
set -g @thm_fg      "#cdcecf"   # ghost body silver
set -g @thm_dim     "#808080"   # solder gray (whoami/host)
set -g @thm_subtle  "#4c4c4c"   # chip legs — separators │, inactive
set -g @thm_accent  "#a3b5c6"   # film blue — the only accent (session, theme cursor)
set -g @thm_active  "#f0f0f0"   # active window = the ghost highlight, brightest thing on the bar
set -g @thm_blue    "#7f9fb8"   # steel blue (ansi4) — display-panes
