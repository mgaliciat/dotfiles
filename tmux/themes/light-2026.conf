# ─── tmux palette: light-2026 ──────────────────────────────────
# vim: ft=tmux
# Clon de "2026 Light", el theme claro por default de VS Code (refresh
# "Focus" de 2026). PALETTE-ONLY: solo define @thm_*; la estructura
# (statusline.conf / theme.conf) los consume con `set -gF`.
#
# Espejo de ghostty/themes/light-2026 y nvim/lua/themes/light-2026.lua.
# Hex sacados de extensions/theme-defaults/themes/2026-light.json en
# microsoft/vscode.

set -g @thm_bg      "#ffffff"   # editor.background — = terminal bg, la barra se mezcla
set -g @thm_bg_sel  "#eaeaea"   # textCodeBlock.background — bg de mensajes / selección
set -g @thm_fg      "#202020"   # foreground
set -g @thm_dim     "#606060"   # descriptionForeground — fg apagado pero legible (whoami/host)
set -g @thm_subtle  "#e4e5e6"   # editorWidget.border — separadores │, inactivos, borders
set -g @thm_accent  "#0069cc"   # button.background/focusBorder — session id, hora, pane activo
set -g @thm_active  "#b69500"   # inputValidation.warningBorder — window activa
set -g @thm_blue    "#1b7c83"   # cyan derivado — display-panes inactivos
