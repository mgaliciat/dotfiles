# ─── tmux palette: light-2026 ──────────────────────────────────
# vim: ft=tmux
# Clone of "2026 Light", VS Code's default light theme (the 2026
# "Focus" refresh). PALETTE-ONLY: it only defines @thm_*; the structure
# (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/light-2026 and nvim/lua/themes/light-2026.lua.
# Hex taken from extensions/theme-defaults/themes/2026-light.json in
# microsoft/vscode.

set -g @thm_bg      "#ffffff"   # editor.background — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#eaeaea"   # textCodeBlock.background — message / selection bg
set -g @thm_fg      "#202020"   # foreground
set -g @thm_dim     "#606060"   # descriptionForeground — dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#e4e5e6"   # editorWidget.border — separators │, inactive, borders
set -g @thm_accent  "#0069cc"   # button.background/focusBorder — session id, time, active pane
set -g @thm_active  "#b69500"   # inputValidation.warningBorder — active window
set -g @thm_blue    "#1b7c83"   # derived cyan — inactive display-panes
