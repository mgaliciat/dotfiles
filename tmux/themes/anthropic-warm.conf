# ─── tmux palette: anthropic-warm ─────────────────────────────
# vim: ft=tmux
# Sepia/terracota cálido. PALETTE-ONLY: solo define @thm_*; la
# estructura los consume con `set -gF`. Absorbe el viejo nvim "warm".
#
# Espejo de ghostty/themes/anthropic-warm y nvim/lua/themes/anthropic-warm.lua.

set -g @thm_bg      "#1a1814"   # carbón cálido (tira a marrón, no negro)
set -g @thm_bg_sel  "#3a2e1f"   # marrón — bg de mensajes / selección
set -g @thm_fg      "#e8dcc4"   # cream warm
set -g @thm_dim     "#a89880"   # tierra clara (whoami/host)
set -g @thm_subtle  "#4a3f33"   # marrón oscuro — separadores │, inactivos
set -g @thm_accent  "#d97757"   # Claude coral — acento principal
set -g @thm_active  "#d9a441"   # ámbar — window activa
set -g @thm_blue    "#6b8e9e"   # acero cálido — display-panes inactivos
