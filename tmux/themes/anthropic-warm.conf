# ─── tmux palette: anthropic-warm ─────────────────────────────
# vim: ft=tmux
# Warm sepia/terracotta. PALETTE-ONLY: it only defines @thm_*; the
# structure consumes them with `set -gF`. Absorbs the old nvim "warm".
#
# Mirror of ghostty/themes/anthropic-warm and nvim/lua/themes/anthropic-warm.lua.

set -g @thm_bg      "#1a1814"   # warm charcoal (leans brown, not black)
set -g @thm_bg_sel  "#3a2e1f"   # brown — message / selection bg
set -g @thm_fg      "#e8dcc4"   # cream warm
set -g @thm_dim     "#a89880"   # light earth (whoami/host)
set -g @thm_subtle  "#4a3f33"   # dark brown — separators │, inactive
set -g @thm_accent  "#d97757"   # Claude coral — main accent
set -g @thm_active  "#d9a441"   # amber — active window
set -g @thm_blue    "#6b8e9e"   # warm steel — inactive display-panes
