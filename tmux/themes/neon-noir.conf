# ─── tmux palette: neon-noir ──────────────────────────────────
# vim: ft=tmux
# True black (#000) noir canvas + neon accents. PALETTE-ONLY:
# it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/neon-noir and nvim/lua/themes/neon-noir.lua.
# DERIVED palette, not a port of Xcode 27's preset — see the Ghostty theme's
# header for the full provenance note. Here the mapping is semantic (tmux has
# no syntax tokens): we pick which colour fills each statusline role.

set -g @thm_bg      "#000000"   # true black OLED canvas
set -g @thm_bg_sel  "#325b90"   # deep blue band (3.03:1 over #000) — message / selection bg
set -g @thm_fg      "#dbe6f4"   # cool off-white
set -g @thm_dim     "#8fa3b8"   # dimmed steel — whoami/host
set -g @thm_subtle  "#62788f"   # comment slate — separators │, inactive
set -g @thm_accent  "#ff4d9d"   # neon magenta — main accent (session, theme cursor)
set -g @thm_active  "#6fd3ff"   # neon cyan — active window
set -g @thm_blue    "#5aa9ff"   # electric blue — display-panes
