# ─── tmux palette: osaka ──────────────────────────────────────
# vim: ft=tmux
# Deep-ocean Solarized Osaka (estilo craftzdog). PALETTE-ONLY: solo
# define los user-options @thm_*; la estructura (statusline.conf /
# theme.conf) los consume con `set -gF`. NO pongas binds ni formatos acá.
#
# Fuente de verdad: el plugin craftzdog/solarized-osaka.nvim. Estos hex
# se extrajeron de `require("solarized-osaka.colors").setup()` — si el
# plugin cambia su paleta, re-extraé. Espejo de ghostty/themes/solarized-osaka.

set -g @thm_bg      "#001419"   # base04 — deep ocean
set -g @thm_bg_sel  "#063540"   # base02 — bg de mensajes / selección
set -g @thm_fg      "#9eabac"   # base0 — texto principal
set -g @thm_dim     "#637981"   # base00 — texto secundario (whoami/host)
set -g @thm_subtle  "#576d74"   # base01 — separadores │, inactivos, borders
set -g @thm_accent  "#d23681"   # magenta — acento principal (firma craftzdog)
set -g @thm_active  "#6d71c4"   # violet — window activa
set -g @thm_blue    "#268bd3"   # blue — display-panes inactivos
