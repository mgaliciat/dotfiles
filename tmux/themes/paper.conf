# ─── tmux palette: paper ──────────────────────────────────────
# vim: ft=tmux
# Light cream + tinta sepia. PALETTE-ONLY: solo define @thm_*; la
# estructura (statusline.conf / theme.conf) los consume con `set -gF`.
#
# Espejo de ghostty/themes/paper y nvim/lua/themes/paper.lua. Absorbe
# el viejo "anthropic-light". Estos hex son los que vivían hardcodeados
# en el statusline.conf/theme.conf previos a la refactorización.

set -g @thm_bg      "#f5ead0"   # cream papel — = terminal bg, la barra se mezcla
set -g @thm_bg_sel  "#d4c298"   # cream tostado — bg de mensajes / selección
set -g @thm_fg      "#2a1f15"   # tinta sepia
set -g @thm_dim     "#5a4830"   # fg apagado pero legible (whoami/host)
set -g @thm_subtle  "#b0a280"   # tierra — separadores │, inactivos, borders
set -g @thm_accent  "#d97757"   # Claude coral — session id, hora, pane activo
set -g @thm_active  "#c08a1e"   # ámbar — window activa
set -g @thm_blue    "#5a7a8e"   # azul humo — display-panes inactivos
