# ─── tmux palette: paper ──────────────────────────────────────
# vim: ft=tmux
# Light cream + sepia ink. PALETTE-ONLY: it only defines @thm_*; the
# structure (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/paper and nvim/lua/themes/paper.lua. Absorbs
# the old "anthropic-light". These hex are the ones that used to live hardcoded
# in the statusline.conf/theme.conf from before the refactor.

set -g @thm_bg      "#f5ead0"   # paper cream — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#d4c298"   # toasted cream — message / selection bg
set -g @thm_fg      "#2a1f15"   # sepia ink
set -g @thm_dim     "#5a4830"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#b0a280"   # earth — separators │, inactive, borders
set -g @thm_accent  "#d97757"   # Claude coral — session id, time, active pane
set -g @thm_active  "#c08a1e"   # amber — active window
set -g @thm_blue    "#5a7a8e"   # smoke blue — inactive display-panes
