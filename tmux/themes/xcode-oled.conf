# ─── tmux palette: xcode-oled ─────────────────────────────────
# vim: ft=tmux
# Xcode "Default (Dark)" syntax over true black (#000). PALETTE-ONLY:
# it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/xcode-oled and nvim/lua/themes/xcode-oled.lua.
# The hex come from Apple's Default (Dark).xccolortheme plist — see the
# Ghostty theme's header for the provenance. Unlike those
# two, here the mapping is a SEMANTIC derivation (tmux has no syntax
# tokens): we pick which Xcode color fills each statusline role.

set -g @thm_bg      "#000000"   # true black OLED (Xcode uses #1f1f24)
set -g @thm_bg_sel  "#515b70"   # DVTSourceTextSelectionColor — message / selection bg
set -g @thm_fg      "#ffffff"   # xcode.syntax.plain
set -g @thm_dim     "#92a1b1"   # xcode.syntax.mark — whoami/host
set -g @thm_subtle  "#6c7986"   # xcode.syntax.comment — separators │, inactive
set -g @thm_accent  "#fc5fa3"   # xcode.syntax.keyword — main accent (theme cursor)
set -g @thm_active  "#9ef1dd"   # xcode.syntax.identifier.type — active window
set -g @thm_blue    "#5482ff"   # xcode.syntax.url — display-panes
