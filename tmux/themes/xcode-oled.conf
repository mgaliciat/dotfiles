# ─── tmux palette: xcode-oled ─────────────────────────────────
# vim: ft=tmux
# Syntax de Xcode "Default (Dark)" sobre true black (#000). PALETTE-ONLY:
# solo define @thm_*; la estructura los consume con `set -gF`.
#
# Espejo de ghostty/themes/xcode-oled y nvim/lua/themes/xcode-oled.lua.
# Los hex salen del plist Default (Dark).xccolortheme de Apple — ver el
# header del theme de Ghostty para la proveniencia. A diferencia de esos
# dos, acá el mapeo es una derivación SEMÁNTICA (tmux no tiene tokens de
# syntax): elegimos qué color de Xcode cumple cada rol de la statusline.

set -g @thm_bg      "#000000"   # true black OLED (Xcode usa #1f1f24)
set -g @thm_bg_sel  "#515b70"   # DVTSourceTextSelectionColor — bg de mensajes / selección
set -g @thm_fg      "#ffffff"   # xcode.syntax.plain
set -g @thm_dim     "#92a1b1"   # xcode.syntax.mark — whoami/host
set -g @thm_subtle  "#6c7986"   # xcode.syntax.comment — separadores │, inactivos
set -g @thm_accent  "#fc5fa3"   # xcode.syntax.keyword — acento principal (cursor del theme)
set -g @thm_active  "#9ef1dd"   # xcode.syntax.identifier.type — window activa
set -g @thm_blue    "#5482ff"   # xcode.syntax.url — display-panes
