# ─── tmux palette: gray ───────────────────────────────────────
# vim: ft=tmux
# Neutral gray bg + near-black ink. PALETTE-ONLY: it only defines @thm_*; the
# structure (statusline.conf / theme.conf) consumes them with `set -gF`.
#
# Mirror of ghostty/themes/gray and nvim/lua/themes/gray.lua.

set -g @thm_bg      "#b5b5b5"   # neutral gray — = terminal bg, the bar blends in
set -g @thm_bg_sel  "#969696"   # darker gray — message / selection bg
set -g @thm_fg      "#0e0e0e"   # near-black ink
set -g @thm_dim     "#3a3a3a"   # dimmed but readable fg (whoami/host)
set -g @thm_subtle  "#767676"   # mid gray — separators │, inactive, borders
set -g @thm_accent  "#d97757"   # Claude coral — session id, time, active pane
set -g @thm_active  "#8a6a10"   # amber — active window
set -g @thm_blue    "#2f5a80"   # blue — inactive display-panes
