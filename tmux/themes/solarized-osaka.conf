# ─── tmux palette: solarized-osaka ────────────────────────────
# vim: ft=tmux
# Deep-ocean Solarized Osaka (craftzdog style). PALETTE-ONLY: it only
# defines the @thm_* user-options; the structure (statusline.conf /
# theme.conf) consumes them with `set -gF`. Do NOT put binds or formats here.
#
# Source of truth: the craftzdog/solarized-osaka.nvim plugin. These hex
# were extracted from `require("solarized-osaka.colors").setup()` — if the
# plugin changes its palette, re-extract. Mirror of ghostty/themes/solarized-osaka.

set -g @thm_bg      "#001419"   # base04 — deep ocean
set -g @thm_bg_sel  "#063540"   # base02 — message / selection bg
set -g @thm_fg      "#9eabac"   # base0 — main text
set -g @thm_dim     "#637981"   # base00 — secondary text (whoami/host)
set -g @thm_subtle  "#576d74"   # base01 — separators │, inactive, borders
set -g @thm_accent  "#d23681"   # magenta — main accent (craftzdog signature)
set -g @thm_active  "#6d71c4"   # violet — active window
set -g @thm_blue    "#268bd3"   # blue — inactive display-panes
