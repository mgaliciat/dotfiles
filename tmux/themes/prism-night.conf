# ─── tmux palette: prism-night ────────────────────────────────
# vim: ft=tmux
# Azul medianoche + arco del espectro (wallpaper "prism" de macOS).
# PALETTE-ONLY: solo define @thm_*; la estructura los consume con `set -gF`.
#
# Espejo de ghostty/themes/prism-night. (@thm_dim es un muted sampleado
# entre fg y subtle; el resto sale directo de la paleta del wallpaper.)

set -g @thm_bg      "#0a0e1a"   # azul medianoche profundo
set -g @thm_bg_sel  "#2e4a7a"   # azul medio — bg de mensajes / selección
set -g @thm_fg      "#c8d3e8"   # azul-gris claro
set -g @thm_dim     "#8896b8"   # muted (whoami/host)
set -g @thm_subtle  "#3a4a6b"   # azul apagado — separadores │, inactivos
set -g @thm_accent  "#ff9248"   # naranja del prisma — acento principal
set -g @thm_active  "#f5c842"   # amarillo del prisma — window activa
set -g @thm_blue    "#4a7ec8"   # azul del prisma — display-panes inactivos
