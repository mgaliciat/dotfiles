# ─── tmux palette: prism-night ────────────────────────────────
# vim: ft=tmux
# Midnight blue + spectrum arc (macOS "prism" wallpaper).
# PALETTE-ONLY: it only defines @thm_*; the structure consumes them with `set -gF`.
#
# Mirror of ghostty/themes/prism-night. (@thm_dim is a muted tone sampled
# between fg and subtle; the rest comes straight from the wallpaper's palette.)

set -g @thm_bg      "#0a0e1a"   # deep midnight blue
set -g @thm_bg_sel  "#2e4a7a"   # mid blue — message / selection bg
set -g @thm_fg      "#c8d3e8"   # light blue-gray
set -g @thm_dim     "#8896b8"   # muted (whoami/host)
set -g @thm_subtle  "#3a4a6b"   # muted blue — separators │, inactive
set -g @thm_accent  "#ff9248"   # prism orange — main accent
set -g @thm_active  "#f5c842"   # prism yellow — active window
set -g @thm_blue    "#4a7ec8"   # prism blue — inactive display-panes
