# ─── statusline.conf — blueprint plana minimalista ────────────
# vim: ft=tmux
# Sin bloques rellenos: solo texto coloreado sobre el bg del terminal.
# Window activa marcada con underline (no con bloque ámbar).
# Si querés volver al estilo powerline con bloques, mirá el git history
# de este archivo.

# Paleta blueprint (reusada de theme.conf):
#   bg          #0e2a47   navy — mismo que terminal, statusline se mezcla
#   fg          #cde3f5
#   fg_dim      #a5c4dc   info secundaria (whoami, hostname)
#   gray        #3b5675   separadores (│), info terciaria
#   cyan        #7dd3fc   acentos (session id, hora)
#   yellow      #e8c468   window activa

set -g status                 "on"
set -g status-interval        5
set -g status-justify         "left"
set -g status-position        bottom
# bg = igual al terminal → la barra "desaparece" cuando no la mirás.
set -g status-style           "fg=#a5c4dc,bg=#0e2a47"

set -g status-left-length     100
set -g status-right-length    100

# ─── left: session:window.pane │ usuario ──────────────────────
# Sin padding extra ni bloques. Solo texto coloreado.
set -g status-left "#[fg=#7dd3fc]#S:#I.#P #[fg=#3b5675]│ #[fg=#a5c4dc]#(whoami) #[fg=#3b5675]│ "

# ─── right: hostname │ hora ───────────────────────────────────
set -g status-right "#[fg=#3b5675]│ #[fg=#a5c4dc]#h #[fg=#3b5675]│ #[fg=#7dd3fc]%H:%M"

# ─── window list ──────────────────────────────────────────────
# Separador entre windows: pipe gris.
setw -g window-status-separator "#[fg=#3b5675] │ "

# Window inactiva: número + cwd, texto fg_dim.
setw -g window-status-style          "fg=#a5c4dc,bg=#0e2a47"
setw -g window-status-format         "#[fg=#3b5675]#I #[fg=#a5c4dc]#{b:pane_current_path}"

# Window activa: número en cyan, nombre subrayado en ámbar.
setw -g window-status-current-style  "fg=#e8c468,bg=#0e2a47,underscore"
setw -g window-status-current-format "#[fg=#7dd3fc]#I #[fg=#e8c468,underscore]#{b:pane_current_path}#{?window_zoomed_flag, ,}"

# Window con actividad (algo pasó en una window de fondo).
setw -g window-status-activity-style "fg=#7dd3fc,bg=#0e2a47"

# ─── statusline off por default ───────────────────────────────
# Sin distracción visual. Cuando la necesités:
#   prefix + b   → toggle on/off
#   prefix + w   → selector visual de windows (alt al statusline)
#   prefix + s   → selector visual de sesiones
set -g status off
bind b set-option -g status
