# ─── statusline.conf — estructura plana minimalista ───────────
# vim: ft=tmux
# Solo ESTRUCTURA. Colores vía @thm_* (ver tmux/themes/<id>.conf,
# sourceado antes en tmux.conf). Sin bloques rellenos: solo texto
# coloreado sobre el bg del terminal. Window activa marcada con
# underline (no con bloque). Si querés volver al estilo powerline,
# mirá el git history.
#
# Mecánica de colores:
#   · style options (status-style, window-status-*-style) → `set -gF`:
#     hornean #{@thm_*} al sourcear (no son formatos, no expanden en draw).
#   · format options (status-left/right, window-status-*-format) → `set -g`:
#     son formatos, expanden #{@thm_*} Y #S/#h/%H:%M en cada render.

set -g status                 "on"
set -g status-interval        5
set -g status-justify         "left"
set -g status-position        bottom
# bg = igual al terminal → la barra "desaparece" cuando no la mirás.
set -gF status-style          "fg=#{@thm_dim},bg=#{@thm_bg}"

set -g status-left-length     100
set -g status-right-length    100

# ─── left: session:window.pane │ usuario ──────────────────────
# Sin padding extra ni bloques. Solo texto coloreado.
set -g status-left "#[fg=#{@thm_accent}]#S:#I.#P #[fg=#{@thm_subtle}]│ #[fg=#{@thm_dim}]#(whoami) #[fg=#{@thm_subtle}]│ "

# ─── right: hostname │ hora ───────────────────────────────────
set -g status-right "#[fg=#{@thm_subtle}]│ #[fg=#{@thm_dim}]#h #[fg=#{@thm_subtle}]│ #[fg=#{@thm_accent}]%H:%M"

# ─── window list ──────────────────────────────────────────────
# Separador entre windows: pipe subtle.
setw -g window-status-separator "#[fg=#{@thm_subtle}] │ "

# Window inactiva: número + cwd, texto dim.
set -gF window-status-style          "fg=#{@thm_dim},bg=#{@thm_bg}"
set -g  window-status-format         "#[fg=#{@thm_subtle}]#I #[fg=#{@thm_dim}]#{b:pane_current_path}"

# Window activa: número en acento, nombre subrayado en activo.
set -gF window-status-current-style  "fg=#{@thm_active},bg=#{@thm_bg},underscore"
set -g  window-status-current-format "#[fg=#{@thm_accent}]#I #[fg=#{@thm_active},underscore]#{b:pane_current_path}#{?window_zoomed_flag, ,}"

# Window con actividad (algo pasó en una window de fondo).
set -gF window-status-activity-style "fg=#{@thm_accent},bg=#{@thm_bg}"

# ─── statusline off por default ───────────────────────────────
# Sin distracción visual. Cuando la necesités:
#   prefix + b   → toggle on/off
#   prefix + w   → selector visual de windows (alt al statusline)
#   prefix + s   → selector visual de sesiones
set -g status off
bind b set-option -g status
