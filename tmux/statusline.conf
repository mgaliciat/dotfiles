# ─── statusline.conf — flat minimalist structure ──────────────
# vim: ft=tmux
# STRUCTURE only. Colors via @thm_* (see tmux/themes/<id>.conf,
# sourced earlier in tmux.conf). No filled blocks: just colored
# text over the terminal bg. The active window is marked with an
# underline (not with a block). If you want to go back to the powerline style,
# check the git history.
#
# How the colors work:
#   · style options (status-style, window-status-*-style) → `set -gF`:
#     they bake #{@thm_*} at source time (they're not formats, they don't expand at draw).
#   · format options (status-left/right, window-status-*-format) → `set -g`:
#     they're formats, they expand #{@thm_*} AND #S/#h/%H:%M on every render.

set -g status                 "on"
set -g status-interval        5
set -g status-justify         "left"
set -g status-position        bottom
# bg = same as the terminal → the bar "disappears" when you're not looking at it.
set -gF status-style          "fg=#{@thm_dim},bg=#{@thm_bg}"

set -g status-left-length     100
set -g status-right-length    100

# ─── left: session:window.pane │ user ─────────────────────────
# No extra padding, no blocks. Just colored text.
set -g status-left "#[fg=#{@thm_accent}]#S:#I.#P #[fg=#{@thm_subtle}]│ #[fg=#{@thm_dim}]#(whoami) #[fg=#{@thm_subtle}]│ "

# ─── right: hostname │ time ───────────────────────────────────
set -g status-right "#[fg=#{@thm_subtle}]│ #[fg=#{@thm_dim}]#h #[fg=#{@thm_subtle}]│ #[fg=#{@thm_accent}]%H:%M"

# ─── window list ──────────────────────────────────────────────
# Separator between windows: subtle pipe.
setw -g window-status-separator "#[fg=#{@thm_subtle}] │ "

# Inactive window: number + cwd, dim text.
set -gF window-status-style          "fg=#{@thm_dim},bg=#{@thm_bg}"
set -g  window-status-format         "#[fg=#{@thm_subtle}]#I #[fg=#{@thm_dim}]#{b:pane_current_path}"

# Active window: number in the accent, name underlined in the active color.
set -gF window-status-current-style  "fg=#{@thm_active},bg=#{@thm_bg},underscore"
# Zoom flag: magnifier in the accent when the pane is zoomed (prefix+z).
set -g  window-status-current-format "#[fg=#{@thm_accent}]#I #[fg=#{@thm_active},underscore]#{b:pane_current_path}#[nounderscore]#{?window_zoomed_flag, #[fg=#{@thm_accent}]󰍉,}"

# Window with activity (something happened in a background window).
set -gF window-status-activity-style "fg=#{@thm_accent},bg=#{@thm_bg}"

# ─── statusline off by default ────────────────────────────────
# No visual distraction. When you need it:
#   prefix + b   → toggle on/off
#   prefix + w   → visual window selector (alternative to the statusline)
#   prefix + s   → visual session selector
set -g status off
bind b set-option -g status
