# ─── statusline.conf — paper plana minimalista ────────────────
# vim: ft=tmux
# Sin bloques rellenos: solo texto coloreado sobre el bg del terminal.
# Window activa marcada con underline (no con bloque ámbar).
# Si querés volver al estilo powerline con bloques, mirá el git history
# de este archivo.

# Paleta paper (reusada de theme.conf):
#   bg          #f5ead0   cream — mismo que terminal, statusline se mezcla
#   fg          #2a1f15
#   fg_dim      #5a4830   info secundaria (whoami, hostname)
#   tierra      #b0a280   separadores (│), info terciaria
#   coral       #d97757   acentos (session id, hora)
#   ámbar       #c08a1e   window activa

set -g status                 "on"
set -g status-interval        5
set -g status-justify         "left"
set -g status-position        bottom
# bg = igual al terminal → la barra "desaparece" cuando no la mirás.
set -g status-style           "fg=#5a4830,bg=#f5ead0"

set -g status-left-length     100
set -g status-right-length    100

# ─── left: session:window.pane │ usuario ──────────────────────
# Sin padding extra ni bloques. Solo texto coloreado.
set -g status-left "#[fg=#d97757]#S:#I.#P #[fg=#b0a280]│ #[fg=#5a4830]#(whoami) #[fg=#b0a280]│ "

# ─── right: hostname │ hora ───────────────────────────────────
set -g status-right "#[fg=#b0a280]│ #[fg=#5a4830]#h #[fg=#b0a280]│ #[fg=#d97757]%H:%M"

# ─── window list ──────────────────────────────────────────────
# Separador entre windows: pipe tierra.
setw -g window-status-separator "#[fg=#b0a280] │ "

# Window inactiva: número + cwd, texto fg_dim.
setw -g window-status-style          "fg=#5a4830,bg=#f5ead0"
setw -g window-status-format         "#[fg=#b0a280]#I #[fg=#5a4830]#{b:pane_current_path}"

# Window activa: número en coral, nombre subrayado en ámbar.
setw -g window-status-current-style  "fg=#c08a1e,bg=#f5ead0,underscore"
setw -g window-status-current-format "#[fg=#d97757]#I #[fg=#c08a1e,underscore]#{b:pane_current_path}#{?window_zoomed_flag, ,}"

# Window con actividad (algo pasó en una window de fondo).
setw -g window-status-activity-style "fg=#d97757,bg=#f5ead0"

# ─── statusline off por default ───────────────────────────────
# Sin distracción visual. Cuando la necesités:
#   prefix + b   → toggle on/off
#   prefix + w   → selector visual de windows (alt al statusline)
#   prefix + s   → selector visual de sesiones
set -g status off
bind b set-option -g status
