# ─── tmux.conf ────────────────────────────────────────────────
# macOS only. Every Ghostty tab starts inside tmux, in a session of its own
# (the auto-tmux block at the top of zsh/.zshrc), and tmux hosts
# tmux-claude-hatch (craftzdog's): each Claude lives in a detached
# `claude-…` session per directory, shown in a popup over the window, and the
# picker lists every Claude running in a tmux pane.
#
# Shortcut index (prefix-less, a single chord; left ⌥ is Alt through
# Ghostty's `macos-option-as-alt = left`):
#   Alt+c      Claude for the pane's directory, in a popup (launch or re-attach)
#   Alt+C      the same with --dangerously-skip-permissions
#   Alt+a      Alt+c through the API gateway (claude-api-env)
#   Alt+A      Alt+C through the API gateway
#   Alt+u      the plugin's picker: every Claude, working / waiting / idle
#   Alt+d      close the Claude popup; the session keeps running, up to
#              @claude_idle_days without being looked at
#   Alt+g      lazygit in a popup
#   Alt+Enter  a shell in a popup
#
# Colours are ANSI names and `default`, never hex: tmux takes the palette of
# whatever Ghostty theme is active, so it is not a layer of the stack theme and
# `scripts/theme` has nothing to rewrite here.

# ─── terminal capability ──────────────────────────────────────
# tmux-256color for the programs inside (italics, undercurl, focus reporting
# without per-app workarounds); true colour has to be declared for the
# terminal outside.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ─── prefix ───────────────────────────────────────────────────
# C-b is vim's page-back. C-t shadows fzf's Ctrl+T file widget inside tmux;
# a double C-t sends it through.
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ─── core behaviour ───────────────────────────────────────────
set -sg escape-time 10          # the 500ms default delays <Esc> in nvim
set -g focus-events on          # nvim autoread / gitsigns
set -g history-limit 64096
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g mouse on

# `on`, not the default `external`: the Claude popup is a nested `tmux attach`,
# so a copy made there leaves as OSC 52 from the inner client — application
# output, which `external` drops before Ghostty.
set -s set-clipboard on

# The shell reports its directory to Ghostty wrapped in tmux's passthrough
# (`_report_cwd` in zsh/.zshrc), so ⌘T opens in the pane's directory.
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#T"

# No session left running unseen: a tab's session ends with its tab (without
# this every tab closed with ⌘W leaves its session behind), and a Claude popup
# session nobody has attached to or typed in for @claude_idle_days ends too.
# reap-sessions.sh (beside this file) does both, on every client that comes or
# goes, and says why this is not `destroy-unattached`. 0 days = no age limit.
set -g @claude_idle_days 15
set-hook -g client-attached 'run-shell -b "~/.config/tmux/reap-sessions.sh"'
set-hook -g client-detached 'run-shell -b "~/.config/tmux/reap-sessions.sh #{q:hook_client}"'

# Splits keep the pane's directory. v / s are the letters of Ghostty's
# ⌘B v / ⌘B s; | and - draw the split they make.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Copy mode: v starts the selection and y copies it, as in vim. The copy
# reaches the macOS clipboard through OSC 52 (set-clipboard above).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── look ─────────────────────────────────────────────────────
# The status line is off: a tab holds one session with, most of the time, one
# window, and Ghostty's own tab bar already names it. prefix + b shows it for
# the times a session grows windows. bg=default everywhere, so the bar sits on
# Ghostty's canvas (and its opacity) instead of a solid strip. A window whose
# Claude rang is drawn in yellow — that is what the hatch's bell forwarding
# lights up.
set -g status off
bind b set -g status
set -g status-position bottom
set -g status-style "fg=brightblack,bg=default"
set -g status-left "#[fg=blue,bold]#S #[default]"
set -g status-left-length 40
set -g status-right ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=default,underscore] #I #W #[default]"
setw -g window-status-bell-style "fg=yellow,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
# The popup and menu bodies on the canvas too. tmux 3.8 fills them with its own
# theme's grey (`bg=themedarkgrey`) by default, so every popup came up as a
# grey slab, as if all of it were selected.
set -g popup-style "default"
set -g popup-border-lines rounded
set -g popup-border-style "fg=brightblack"
set -g menu-style "default"
set -g menu-border-style "fg=brightblack"
set -g menu-selected-style "reverse"
set -g message-style "fg=default,bg=default,bold"
set -g mode-style "reverse"

# ─── tmux-claude-hatch ────────────────────────────────────────
# craftzdog's plugin, cloned and pinned by install.sh (no tpm: one plugin,
# pinned anyway). Options go before the `run-shell` that reads them.
#
# Picker cache off: its first frame would come from a cache only the hatch's
# Claude Code plugin keeps fresh (not installed), and since the plugin reads
# the session files directly the live list is fast enough on its own.
set -g @claude_picker_cache 'off'

if-shell 'test -x ~/.config/tmux/plugins/tmux-claude-hatch/claude_hatch.tmux' \
  'run-shell ~/.config/tmux/plugins/tmux-claude-hatch/claude_hatch.tmux' \
  'display-message "tmux-claude-hatch is not cloned — run ./install.sh"'

# The picker on a single chord; the plugin's own prefix + u stays bound.
#
# `#{q:…}` bare, here and below, not the plugin's own `'#{q:…}'`: q already
# escapes for the shell, and wrapping that in single quotes keeps the
# backslashes, which breaks on a directory whose name has a quote or a space.
bind -n M-u run-shell "~/.config/tmux/plugins/tmux-claude-hatch/scripts/list.sh #{q:client_name}"

# ─── Claude in a popup ────────────────────────────────────────
# claude-popup.sh (beside this file) launches the session or re-attaches to it;
# its header lists the four variants and how they fit the plugin. Uppercase is
# the same thing without permission prompts — keep it to versioned repos.
bind -n M-c run-shell "~/.config/tmux/claude-popup.sh plain #{q:pane_current_path} #{q:window_id} #{q:session_name} #{q:client_name}"
bind -n M-C run-shell "~/.config/tmux/claude-popup.sh yolo #{q:pane_current_path} #{q:window_id} #{q:session_name} #{q:client_name}"
bind -n M-a run-shell "~/.config/tmux/claude-popup.sh api #{q:pane_current_path} #{q:window_id} #{q:session_name} #{q:client_name}"
bind -n M-A run-shell "~/.config/tmux/claude-popup.sh api-yolo #{q:pane_current_path} #{q:window_id} #{q:session_name} #{q:client_name}"

# The plugin's prefix + y would start Alt+c's session through its own launcher,
# which does not keep the Mac awake; Alt+c is the one way in.
unbind y

# Detach only from a Claude popup; anywhere else ⌥d goes to the program
# (zsh's kill-word), so it never drops you out of the tab's session.
bind -n M-d if -F '#{m:claude-*,#{session_name}}' 'detach-client' 'send-keys M-d'

# ─── lazygit and a shell in popups ────────────────────────────
# For the tool or the one-off command that does not deserve a pane. q closes
# lazygit, `exit` the shell.
bind -n M-g display-popup -T " lazygit " -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
bind -n M-Enter display-popup -T " shell " -d "#{pane_current_path}" -w 90% -h 90% -E "$SHELL"
