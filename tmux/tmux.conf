# ─── tmux.conf — entry point ──────────────────────────────────
# Estructura modular: este archivo setea base + carga los demás.
# Cambios visuales → theme.conf / statusline.conf.
# Popups sin prefix (Alt+c/x/g/Enter) → utility.conf.

# ─── terminal capability ──────────────────────────────────────
# xterm-256color + Tc (true color) → necesario para que nvim
# muestre colores 24-bit dentro de tmux.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ─── prefix ───────────────────────────────────────────────────
# Default C-b colisiona con vim "page back". C-t no choca con
# nada común. Para cambiarlo: editá las 2 líneas siguientes.
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix     # doble C-t envía un C-t literal al pane

# ─── core behavior ────────────────────────────────────────────
# escape-time bajo es CRÍTICO para nvim — default 500ms hace que
# <Esc> en nvim tenga delay perceptible al estar dentro de tmux.
set -sg escape-time 10

# focus-events: nvim usa esto para autoread, gitsigns refresh,
# etc. Sin esto, gitsigns no detecta cambios externos.
set-option -g focus-events on

# repeat-time 0: desactiva el "modo repeat" para bind -r. Si querés
# que algunos binds se puedan repetir sin re-presionar prefix,
# subilo a 500.
set-option -g repeat-time 0

# Scrollback largo — útil al revisar output de comandos pasados.
set-option -g history-limit 64096

# Numerar windows/panes desde 1 (más natural con teclado numérico).
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Mouse on — clickeás panes/ventanas, scroll wheel, resize splits.
# Si te molesta, sacalo: set -g mouse off
set-option -g mouse on

# Mode-keys vi → en copy mode (prefix [) navegás con hjkl, yank
# con y, etc. Coherente con nvim.
set-window-option -g mode-keys vi

# Title bar adapta al host (útil si SSH-eás).
set -g set-titles on
set -g set-titles-string "#T"

# Passthrough de escapes DCS → deja que el shell reporte su cwd
# (OSC 7) a Ghostty AUNQUE esté envuelto por tmux. Sin esto, tmux
# se come el OSC 7 y Ghostty abre cada Cmd+T en el cwd de login en
# vez del directorio actual. El wrapper passthrough vive en .zshrc.
set -g allow-passthrough on

# ─── keybinds base ────────────────────────────────────────────
# Reload config sin matar la sesión.
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Abrir el directorio actual del pane en Finder.
bind o run-shell "open '#{pane_current_path}'"

# Kill todos los panes de la window actual (cuidado, no pide confirm).
bind -r e kill-pane -a

# Splits manteniendo el cwd del pane original (default tmux abre en $HOME).
# Reemplaza las defaults % y ".
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# Navegación entre panes con prefix + hjkl (vim-style).
# tmux-pain-control también lo da, pero lo defino acá por si lo desactivas.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Layout IDE — prefix + I arma 5 panes estilo IDE (editor arriba, 2
# panes en medio, terminal abajo, sidebar derecho). Script en
# ~/dotfiles/scripts/ide (adaptado de craftzdog).
bind I run-shell "~/dotfiles/scripts/ide"

# Mover windows con C-Shift-Left/Right (sin prefix, instantáneo).
bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Copy mode vi-style: y copia al system clipboard.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ─── imports condicionales ────────────────────────────────────
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# ─── tema del stack ───────────────────────────────────────────
# Paleta primero (setea los user-options @thm_*), estructura después
# (los consume con `set -gF`). Mismo patrón override-at-end que el
# resto del repo (.zshrc.local, .gitconfig.local):
#   1. default versionado de la familia (carbon, minimal true-black).
#   2. override per-máquina: `scripts/theme <id>` escribe current.local
#      (gitignored) con `source themes/<id>.conf`. `-q` = no falla si
#      no existe → máquina recién clonada cae al default de arriba.
source ~/.config/tmux/themes/carbon.conf
source -q ~/.config/tmux/current.local

source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# ─── plugins (tpm) ────────────────────────────────────────────
# tpm clonado por install.sh. Para instalar plugins nuevos:
# editá la lista → prefix + I (mayúscula). Update: prefix + U.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'   # prefix + h/j/k/l mejorado, resize con HJKL
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix + Ctrl+s save, Ctrl+r restore (sobrevive reboots)
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save de tmux-resurrect cada 15 min

# tmux-continuum: auto-restore al iniciar tmux.
set -g @continuum-restore 'on'

# tpm debe ser la última línea del config.
run '~/.config/tmux/plugins/tpm/tpm'
