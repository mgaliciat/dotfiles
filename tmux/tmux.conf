# ─── tmux.conf — the host for tmux-claude-hatch ───────────────
# macOS only. Ghostty stays the multiplexer for everyday splits and tabs (⌘B);
# tmux is here because the hatch is a tmux plugin: each Claude lives in a
# detached `claude-<hash>` session per directory, shown in a popup, and the
# picker lists every Claude running in a tmux pane. A Claude started in a
# plain Ghostty split is invisible to it — start them from inside tmux.
#
# Shortcut index (prefix-less, a single chord; left ⌥ is Alt through
# Ghostty's `macos-option-as-alt = left`):
#   Alt+y   Claude for the pane's directory, in a popup (launch or re-attach)
#   Alt+Y   the same on a git worktree you name (our fork's addition)
#   Alt+u   the picker: every Claude, working / waiting / idle, with preview,
#           grouped by repository; ctrl-r there labels an agent (both our
#           fork's additions)
#   Alt+d   close the Claude popup; the session keeps running
# The plugin's own prefix+y / prefix+u stay bound too.
#
# Colours are ANSI names and `default`, never hex: tmux takes the palette of
# whatever Ghostty theme is active, so it is not a layer of the stack theme and
# `scripts/theme` has nothing to rewrite here.

# ─── terminal capability ──────────────────────────────────────
# tmux-256color for the programs inside (italics, undercurl, focus reporting
# without per-app workarounds); true colour has to be declared for the
# terminal outside.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ─── prefix ───────────────────────────────────────────────────
# C-b is vim's page-back. C-t shadows fzf's Ctrl+T file widget inside tmux;
# a double C-t sends it through.
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ─── core behaviour ───────────────────────────────────────────
set -sg escape-time 10          # the 500ms default delays <Esc> in nvim
set -g focus-events on          # nvim autoread / gitsigns
set -g history-limit 64096
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g mouse on

# `on`, not the default `external`: the hatch shows Claude through a nested
# `tmux attach` inside a popup, so a copy made there leaves as OSC 52 from the
# inner client — application output, which `external` drops before Ghostty.
set -s set-clipboard on

# OSC 7 from the shell reaches Ghostty, so ⌘T opens in the pane's directory.
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#T"

# Splits keep the pane's directory, letters as in Ghostty's ⌘B v / ⌘B s.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── look ─────────────────────────────────────────────────────
# bg=default everywhere: the bar sits on Ghostty's canvas (and its opacity)
# instead of a solid strip. A window whose Claude rang is drawn in yellow —
# that is what the hatch's bell forwarding lights up.
set -g status-position bottom
set -g status-style "fg=brightblack,bg=default"
set -g status-left "#[fg=blue,bold]#S #[default]"
set -g status-left-length 40
set -g status-right ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=default,underscore] #I #W #[default]"
setw -g window-status-bell-style "fg=yellow,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
# The popup and menu bodies on the canvas too. tmux 3.8 fills them with its own
# theme's grey (`bg=themedarkgrey`) by default, so every hatch popup came up as
# a grey slab, as if all of it were selected.
set -g popup-style "default"
set -g popup-border-lines rounded
set -g popup-border-style "fg=brightblack"
set -g menu-style "default"
set -g menu-border-style "fg=brightblack"
set -g menu-selected-style "reverse"
set -g message-style "fg=default,bg=default,bold"
set -g mode-style "reverse"

# ─── tmux-claude-hatch ────────────────────────────────────────
# Cloned and pinned by install.sh (no tpm: one plugin, pinned anyway). Options
# go before the `run-shell` that reads them.
#
# Picker cache off: its first frame would come from a cache only the hatch's
# Claude Code plugin keeps fresh (not installed), and since upstream reads the
# session files directly the live list is fast enough on its own.
set -g @claude_picker_cache 'off'
if-shell 'test -x ~/.config/tmux/plugins/tmux-claude-hatch/claude_hatch.tmux' \
  'run-shell ~/.config/tmux/plugins/tmux-claude-hatch/claude_hatch.tmux' \
  'display-message "tmux-claude-hatch is not cloned — run ./install.sh"'

# The same plugin scripts as prefix+y / prefix+u, on a single chord.
#
# `#{q:…}` bare, not the plugin's own `'#{q:…}'`: q already escapes for the
# shell, and wrapping that in single quotes keeps the backslashes, which breaks
# on a directory whose name has a quote or a space.
bind -n M-y run-shell "~/.config/tmux/plugins/tmux-claude-hatch/scripts/launch.sh #{q:pane_current_path} #{q:window_id}"
bind -n M-u run-shell "~/.config/tmux/plugins/tmux-claude-hatch/scripts/list.sh #{q:client_name}"

# Alt+Shift+y: the same, on a git worktree — asks for its name (or `#1234`, a
# PR URL) and Claude starts with `--worktree <name>`, so Claude Code owns the
# worktree: .claude/worktrees/<name>/ on branch worktree-<name>, reopened when
# it exists, keep-or-remove asked on exit. The hatch adds a session of its own,
# labelled ⎇ <name>, that the same name re-attaches (our fork's addition). The
# name goes through a user option so what you type never reaches the shell
# unquoted.
bind -n M-Y command-prompt -p 'worktree:' \
  "set -g @claude_worktree '%%%' ; run-shell \"~/.config/tmux/plugins/tmux-claude-hatch/scripts/launch.sh #{q:pane_current_path} #{q:window_id} #{q:@claude_worktree}\""

# Detach only from a Claude popup; anywhere else ⌥d goes to the program
# (zsh's kill-word), so it never drops you out of your main session.
bind -n M-d if -F '#{m:claude-*,#{session_name}}' 'detach-client' 'send-keys M-d'
