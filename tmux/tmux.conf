# ─── tmux.conf — entry point ──────────────────────────────────
# Modular structure: this file sets the base + loads the rest.
# Visual changes → theme.conf / statusline.conf.
# Prefix-less overlays (Alt+c/C/y/u/d/g/Enter) → utility.conf.

# ─── terminal capability ──────────────────────────────────────
# xterm-256color + Tc (true color) → needed so nvim shows
# 24-bit colors inside tmux.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ─── prefix ───────────────────────────────────────────────────
# Default C-b collides with vim "page back". C-t doesn't clash with
# anything common. To change it: edit the next 2 lines.
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix     # double C-t sends a literal C-t to the pane

# ─── core behavior ────────────────────────────────────────────
# A low escape-time is CRITICAL for nvim — the 500ms default makes
# <Esc> in nvim have a noticeable delay when inside tmux.
set -sg escape-time 10

# focus-events: nvim uses this for autoread, gitsigns refresh,
# etc. Without it, gitsigns doesn't detect external changes.
set-option -g focus-events on

# repeat-time 0: disables "repeat mode" for bind -r. If you want
# some binds to be repeatable without pressing prefix again,
# raise it to 500.
set-option -g repeat-time 0

# Long scrollback — useful when reviewing output of past commands.
set-option -g history-limit 64096

# Number windows/panes from 1 (more natural with the numeric keypad).
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Mouse on — you click panes/windows, scroll wheel, resize splits.
# If it bugs you, remove it: set -g mouse off
#
# FOOTGUN, and it reads like a bug: dragging over text highlights it, but the
# highlight vanishes the instant you release and the cursor snaps back to the
# prompt. That's tmux's own default binding, not Ghostty —
# `MouseDragEnd1Pane send -X copy-pipe-and-cancel`, where `-and-cancel` exits
# copy-mode on mouse-up. The copy still lands on the macOS clipboard
# (set-clipboard external → OSC 52 → Ghostty's clipboard-write = allow); only
# the highlight is lost. Use Shift+drag to select instead: Ghostty's
# mouse-shift-capture = false keeps Shift out of the mouse protocol, so the
# selection is Ghostty's own — it persists, and copy-on-select already copies it.
#
# Don't "fix" this with `copy-pipe-no-clear`: keeping the selection means
# staying in copy-mode, so everything you type afterwards is eaten by copy-mode
# (j/k scroll, q quits) until you hit Escape. A dead prompt is worse than a
# highlight that disappears.
set-option -g mouse on

# Mode-keys vi → in copy mode (prefix [) you navigate with hjkl, yank
# with y, etc. Consistent with nvim.
set-window-option -g mode-keys vi

# Title bar adapts to the host (useful if you SSH).
set -g set-titles on
set -g set-titles-string "#T"

# DCS escape passthrough → lets the shell report its cwd (OSC 7) to
# Ghostty EVEN when wrapped by tmux. Without this, tmux eats the OSC 7
# and Ghostty opens every Cmd+T in the login cwd instead of the current
# directory. The passthrough wrapper lives in .zshrc.
set -g allow-passthrough on

# ─── base keybinds ────────────────────────────────────────────
# Reload config without killing the session.
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open the pane's current directory in Finder.
bind o run-shell "open '#{pane_current_path}'"

# Kill every other pane of the current window (careful, no confirm prompt).
bind -r e kill-pane -a

# Splits that keep the original pane's cwd (tmux defaults to $HOME).
# Replaces the default % and ".
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# Pane navigation with prefix + hjkl (vim-style).
# tmux-pain-control also provides it, but it's defined here in case you disable it.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# IDE layout — prefix + g builds 4 IDE-style panes (big main pane,
# 2 columns in the middle, terminal at the bottom, right sidebar). Layout
# only: it doesn't launch nvim or lazygit — you pick what runs in each pane.
# Script is scripts/ide in the repo (adapted from craftzdog), reached through the
# ~/.local/bin symlink the installers create — not by repo path, so the bind
# keeps working when the repo is cloned somewhere other than ~/dotfiles.
# WATCH OUT: don't use `I` for this — tpm re-binds prefix+I (install plugins)
# on startup and clobbers any bind of your own on that key.
bind g run-shell "~/.local/bin/ide"

# Move windows with C-Shift-Left/Right (no prefix, instant).
bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Copy mode vi-style: y copies to the system clipboard.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ─── conditional imports ──────────────────────────────────────
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# ─── stack theme ──────────────────────────────────────────────
# Palette first (sets the @thm_* user-options), structure after
# (it consumes them with `set -gF`). This line is THE active selection and the
# source of truth: versioned, a `git pull` propagates the theme to the
# other machines. To change the look, point this source at another palette
# in themes/ (and edit the equivalent lines in Ghostty and nvim —
# they share the id) and commit. There's no switcher and no pointer.
source ~/.config/tmux/themes/solarized-osaka.conf

source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# ─── plugins (tpm) ────────────────────────────────────────────
# tpm cloned by install.sh. To install new plugins:
# edit the list → prefix + I (uppercase). Update: prefix + U.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'   # improved prefix + h/j/k/l, resize with HJKL
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix + Ctrl+s save, Ctrl+r restore (survives reboots)
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save of tmux-resurrect every 15 min
# Central picker of Claude Code sessions with live working/waiting/idle state
# + per-directory launcher. The plugin binds them under prefix (y/u) but we
# rebind them to Alt+u/Alt+y in utility.conf (unbind y/u further below). The state
# comes straight from `claude agents --json` (Claude Code ≥ 2.1.139 + jq) —
# no hooks, no touching settings.json.
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# tmux-continuum: auto-restore when tmux starts.
set -g @continuum-restore 'on'

# tpm must be the last line of the config (plugins bind their keys here).
run '~/.config/tmux/plugins/tpm/tpm'

# Post-tpm override: tmux-claude-session-manager binds prefix+y/prefix+u,
# but we want them as a single chord Alt+y/Alt+u (see utility.conf). They must be
# unbound AFTER tpm — otherwise the plugin re-binds them on top. They stay free
# in the prefix table (they weren't tmux defaults).
unbind y
unbind u
