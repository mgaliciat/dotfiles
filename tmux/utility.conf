# ─── utility.conf — popups productividad ──────────────────────
# vim: ft=tmux
# Las "joyas" del setup de craftzdog: overlays flotantes para
# herramientas que no querés que ocupen un pane permanente.
#
# Índice de atajos (todos sin prefix, un solo chord):
#   Alt+c     Claude Code (sesión "default" por proyecto, persistente)
#   Alt+C     Claude skip permissions (sesión "default YOLO" separada)
#   Alt+d     cerrar popup Claude (detach seguro)
#   Alt+g     lazygit
#   Alt+Enter shell rápida
#
# Requiere Ghostty con `macos-option-as-alt = left` para que la
# tecla Option izquierda emita M- en vez de caracteres Unicode.

# ─── lazygit en popup (Alt+g) ─────────────────────────────────
# Abre lazygit en flotante 85%, en el cwd del pane. Cerrás con q.
# Tu workflow de tmux queda intacto debajo.
bind -n M-g display-popup -d '#{pane_current_path}' -w100% -h100% -B -E lazygit

# ─── Claude Code por proyecto (Alt+c) ─────────────────────────
# UNA sesión Claude por directorio (identificada por md5 del path).
# - Si la sesión ya existe → attachea, mantenés contexto.
# - Si no existe → la crea con `claude` corriendo dentro.
# Cerrás el popup, Claude sigue vivo en background → reabrir
# desde otro pane del mismo proyecto te devuelve la misma sesión.
#
# El popup es 90% — deja ver un borde de la sesión de abajo y matchea
# el tamaño del launcher del plugin (prefix+y), que usa la MISMA sesión
# (mismo hash md5). Para el picker cross-proyecto con estado live, ver
# `prefix+u` del plugin tmux-claude-session-manager (reemplazó al viejo Alt+s).
#
# Guarda: si ya estás dentro de una sesión claude* (popup abierto),
# el binding es no-op — evita anidar popups infinitamente al
# presionar Alt+c de nuevo por reflejo. El `case` corre dentro del
# shell, después de que tmux ya expandió #{session_name}.
bind -n M-c run-shell '\
  case "#{session_name}" in claude*) exit 0;; esac; \
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w90% -h90% -B -E "tmux attach-session -t $SESSION"'

# ─── Claude YOLO mode (Alt+Shift+C) ───────────────────────────
# Igual que Alt+c pero con --dangerously-skip-permissions: Claude
# ejecuta cualquier bash/edit sin pedir confirmación. Útil para
# refactors masivos o exploración rápida.
#
# Sesión SEPARADA del Claude normal (prefijo `claude-yolo-`) para
# que los dos contextos no se mezclen — si trabajás un día seguro
# y otro en YOLO, son conversaciones distintas.
#
# Convención: mayúscula = sin límites.
#
# ⚠️ Recomendado solo en repos versionados o sandboxes — Claude
# puede borrar archivos, hacer pushes, etc., sin preguntar.
#
# Misma guarda que Alt+c: si ya estás dentro de cualquier sesión
# claude* (normal o yolo), el binding es no-op.
bind -n M-C run-shell '\
  case "#{session_name}" in claude*) exit 0;; esac; \
  SESSION="claude-yolo-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude --dangerously-skip-permissions"; \
  tmux display-popup -w90% -h90% -B -E "tmux attach-session -t $SESSION"'

# ─── cerrar popup Claude (Alt+d) ──────────────────────────────
# Detach seguro: solo hace detach-client si la sesión actual se
# llama claude* (o claude-yolo-*). Fuera de un popup Claude el
# binding es no-op — no te saca de tu sesión principal por error.
bind -n M-d if -F '#{m:claude*,#{session_name}}' 'detach-client'

# ─── shell rápida en popup (Alt+Enter) ────────────────────────
# Útil para comandos one-off (git status, ls, etc.) sin ocupar pane.
bind -n M-Enter display-popup -d '#{pane_current_path}' -w100% -h100% -B -E "$SHELL"
