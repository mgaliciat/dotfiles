# ─── utility.conf — productivity popups ───────────────────────
# vim: ft=tmux
# The "gems" of craftzdog's setup: floating overlays for
# tools you don't want taking up a permanent pane.
#
# Shortcut index (all prefix-less, a single chord):
#   Alt+c     Claude Code ("default" session per project, persistent)
#   Alt+C     Claude skip permissions (separate "default YOLO" session)
#   Alt+y     plugin launcher (the dir's Claude session, same as Alt+c)
#   Alt+u     plugin picker (all Claude sessions, live state)
#   Alt+d     close the Claude popup (safe detach)
#   Alt+g     lazygit
#   Alt+Enter quick shell
#
# Requires Ghostty with `macos-option-as-alt = left` so the left
# Option key emits M- instead of Unicode characters.

# ─── lazygit in a popup (Alt+g) ───────────────────────────────
# Opens lazygit floating at 90% (with the rounded frame from theme.conf),
# in the pane's cwd. You close it with q. Your tmux workflow stays intact underneath.
bind -n M-g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

# ─── Claude Code per project (Alt+c) ──────────────────────────
# ONE Claude session per directory (identified by the md5 of the path).
# - If the session already exists → attach, you keep the context.
# - If it doesn't → create it with `claude` running inside.
# You close the popup, Claude stays alive in the background → reopening
# from another pane of the same project gives you back the same session.
#
# The popup is 90% (no `-B`, so tmux draws the frame: the rounded
# border + color come from theme.conf via popup-border-* @thm_*).
# It matches the size of the plugin launcher (Alt+y), which uses the SAME
# session (same md5 hash). For the cross-project picker with live state,
# see `Alt+u` from the tmux-claude-session-manager plugin (it replaced Alt+s).
#
# Guard: if you're already inside a claude* session (popup open),
# the binding is a no-op — it stops you from nesting popups endlessly by
# hitting Alt+c again out of reflex. The `case` runs inside the
# shell, after tmux has already expanded #{session_name}.
#
# `caffeinate -di` wrap: same as the YOLO binding below (see its comment
# for the full rationale + Linux guard) — without it a normal Alt+c
# session lets the Mac idle-sleep AND the display sleep (→ lock screen)
# mid-run.
bind -n M-c run-shell '\
  case "#{session_name}" in claude*) exit 0;; esac; \
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "command -v caffeinate >/dev/null 2>&1 && exec caffeinate -di claude || exec claude"; \
  tmux display-popup -w90% -h90% -E "tmux attach-session -t $SESSION"'

# ─── Claude YOLO mode (Alt+Shift+C) ───────────────────────────
# Same as Alt+c but with --dangerously-skip-permissions: Claude
# runs any bash/edit without asking for confirmation. Useful for
# massive refactors or quick exploration.
#
# SEPARATE session from the normal Claude (prefix `claude-yolo-`) so
# the two contexts don't mix — if you work one day in safe mode
# and another in YOLO, they're different conversations.
#
# Convention: uppercase = no limits.
#
# ⚠️ Recommended only in versioned repos or sandboxes — Claude
# can delete files, push, etc., without asking.
#
# Wrapped in `caffeinate -di`: while this Claude process lives (even
# detached in the background), the Mac won't idle-sleep (`-i`) NOR let
# the display sleep (`-d`). The `-d` is load-bearing: `-i` alone keeps
# the SYSTEM awake but the screen still turns off on the displaysleep
# timer (2 min on battery) → lock screen → password prompt mid-run. The
# assertion is tied to the process, so it releases itself when Claude
# exits — no stray "stay awake" left running like a global Amphetamine
# toggle. Trade-off: the screen stays lit the whole time any Claude
# session is alive in the background, even while it's idle-waiting.
#
# `caffeinate` is macOS-only (/usr/bin, ships with the OS). This file is
# symlinked on Linux/WSL2 too, so guard it: `command -v caffeinate` →
# wrap if present, else `exec claude` bare. Without the guard the popup
# would break on Linux (missing binary → sh error → Claude never starts).
# No portable equivalent added on purpose: on WSL2 there's nothing to
# keep awake, and desktop-Linux idle-sleep is a rare enough case to skip.
#
# Same guard as Alt+c: if you're already inside any claude*
# session (normal or yolo), the binding is a no-op.
bind -n M-C run-shell '\
  case "#{session_name}" in claude*) exit 0;; esac; \
  SESSION="claude-yolo-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "command -v caffeinate >/dev/null 2>&1 && exec caffeinate -di claude --dangerously-skip-permissions || exec claude --dangerously-skip-permissions"; \
  tmux display-popup -w90% -h90% -E "tmux attach-session -t $SESSION"'

# ─── tmux-claude-session-manager plugin, prefix-less (Alt+y / Alt+u) ──
# The plugin binds its commands in the PREFIX table (prefix+y launcher,
# prefix+u picker). Here we expose them as a single chord Alt+y/Alt+u —
# consistent with the rest of the popups in this file. We call the
# SAME plugin scripts with the args each one expects (expanded
# by run-shell). The prefix binds are disabled in tmux.conf (after
# tpm, otherwise the plugin re-binds them). If the plugin isn't cloned,
# the run-shell exits with a harmless error (script doesn't exist).
bind -n M-y run-shell "~/.config/tmux/plugins/tmux-claude-session-manager/scripts/launch.sh '#{pane_current_path}' '#{window_id}'"
bind -n M-u run-shell "~/.config/tmux/plugins/tmux-claude-session-manager/scripts/list.sh '#{client_name}'"

# ─── close the Claude popup (Alt+d) ───────────────────────────
# Safe detach: it only runs detach-client if the current session is
# named claude* (or claude-yolo-*). Outside a Claude popup the
# binding is a no-op — it won't kick you out of your main session by mistake.
bind -n M-d if -F '#{m:claude*,#{session_name}}' 'detach-client'

# ─── quick shell in a popup (Alt+Enter) ───────────────────────
# Useful for one-off commands (git status, ls, etc.) without taking up a pane.
bind -n M-Enter display-popup -d '#{pane_current_path}' -w90% -h90% -E "$SHELL"
