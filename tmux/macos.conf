# ─── macos.conf ───────────────────────────────────────────────
# Específicos macOS. Importado desde tmux.conf solo si uname=Darwin.

# Undercurl support — para que nvim muestre subrayado ondulado
# en diagnostics de LSP (errores, warnings) cuando corre dentro
# de tmux. Sin esto se ve como subrayado plano.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Clipboard: tmux 2.6+ ya soporta clipboard nativo en macOS sin
# reattach-to-user-namespace. NO necesitamos el hack viejo.
# `pbcopy` funciona directo desde copy-mode (definido en tmux.conf).
