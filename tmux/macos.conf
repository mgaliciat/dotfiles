# ─── macos.conf ───────────────────────────────────────────────
# macOS specifics. Imported from tmux.conf only if uname=Darwin.

# prefix + o: the pane's directory in Finder (tmux.conf's bind is the
# Explorer / xdg-open one).
bind o run-shell -b "open '#{pane_current_path}'"

# y in copy mode: OSC 52 already carries the copy (tmux.conf); pbcopy on top
# keeps it working in a terminal that has OSC 52 writes turned off.
# tmux 2.6+ reaches the macOS clipboard without reattach-to-user-namespace.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
