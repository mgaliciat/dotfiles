# ─── macos.conf ───────────────────────────────────────────────
# macOS specifics. Imported from tmux.conf only if uname=Darwin.

# Undercurl support — so nvim shows a wavy underline
# on LSP diagnostics (errors, warnings) when it runs inside
# tmux. Without this it looks like a flat underline.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Clipboard: tmux 2.6+ already supports the native macOS clipboard without
# reattach-to-user-namespace. We do NOT need the old hack.
# `pbcopy` works directly from copy-mode (defined in tmux.conf).
