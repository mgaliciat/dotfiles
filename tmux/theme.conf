# ─── theme.conf — paleta blueprint ────────────────────────────
# Espejo de la paleta del theme Ghostty `blueprint-engineering`
# y del colorscheme nvim. Tres archivos, misma fuente conceptual:
#   - ghostty/themes/blueprint-engineering
#   - nvim/lua/plugins/colorscheme.lua
#   - este archivo

# Paleta blueprint:
#   bg          #0e2a47   navy profundo
#   bg_dark     #0a223a   ANSI 0
#   bg_border   #1e4571   selection bg
#   fg          #cde3f5   tinta sobre papel
#   fg_dim      #a5c4dc
#   cyan        #7dd3fc   cursor, acentos
#   blue        #5a9fff
#   green       #7fdca4
#   yellow      #e8c468   active window
#   red         #e87a7a
#   magenta     #c89fff
#   gray        #3b5675   bright_black — borders/inactive

# ─── panes ────────────────────────────────────────────────────
set -g pane-border-style        "fg=#3b5675"
set -g pane-active-border-style "fg=#7dd3fc"

# ─── messages / command line ──────────────────────────────────
set -g message-style         "fg=#cde3f5,bg=#1e4571,bold"
set -g message-command-style "fg=#cde3f5,bg=#1e4571"

# ─── copy mode ────────────────────────────────────────────────
set -g mode-style "fg=#0e2a47,bg=#e8c468"   # selección en ámbar

# ─── pane numbers (display-panes) ─────────────────────────────
set -g display-panes-active-colour "#7dd3fc"
set -g display-panes-colour        "#5a9fff"

# ─── clock (prefix t) ─────────────────────────────────────────
set-window-option -g clock-mode-colour "#7dd3fc"
