# ─── theme.conf — estructura de panes / mensajes / modos ──────
# vim: ft=tmux
# Solo ESTRUCTURA. Los colores vienen de tmux/themes/<id>.conf vía los
# user-options @thm_* (sourceados ANTES en tmux.conf). `set -gF` hornea
# el valor actual de la variable al momento de sourcear — por eso este
# archivo va DESPUÉS de la paleta. Cambiar de tema = apuntar el `source`
# de la paleta en tmux.conf a otro themes/<id>.conf, nunca este archivo.
#
# Roles disponibles: @thm_bg @thm_bg_sel @thm_fg @thm_dim @thm_subtle
#                    @thm_accent @thm_active @thm_blue

# ─── panes ────────────────────────────────────────────────────
set -gF pane-border-style        "fg=#{@thm_subtle}"
set -gF pane-active-border-style "fg=#{@thm_accent}"

# ─── popups (display-popup) ───────────────────────────────────
# Marco de los overlays flotantes (Alt+c/Alt+C Claude, Alt+y/Alt+u del
# plugin, etc.). Antes los popups iban con `-B` (sin borde) y a 90% se
# veían flotando sin definición. `popup-border-lines` es estructura (no
# color) → set -g; el color sí es style → set -gF con @thm_accent (la
# firma magenta, igual que el pane activo). Borde redondeado estilo craftzdog.
set -g  popup-border-lines rounded
set -gF popup-border-style "fg=#{@thm_accent}"

# ─── messages / command line ──────────────────────────────────
set -gF message-style         "fg=#{@thm_fg},bg=#{@thm_bg_sel},bold"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg_sel}"

# ─── copy mode ────────────────────────────────────────────────
# Selección sobre el acento "activo" (ámbar/violet según tema).
set -gF mode-style "fg=#{@thm_bg},bg=#{@thm_active}"

# ─── pane numbers (display-panes) ─────────────────────────────
set -gF display-panes-active-colour "#{@thm_accent}"
set -gF display-panes-colour        "#{@thm_blue}"

# ─── clock (prefix t) ─────────────────────────────────────────
setw -gF clock-mode-colour "#{@thm_accent}"
