# ─── theme.conf — paleta anthropic-paper ──────────────────────
# Espejo de la paleta del theme Ghostty `anthropic-paper` y del
# colorscheme nvim. Tres archivos, misma fuente conceptual:
#   - ghostty/themes/anthropic-paper
#   - nvim/lua/plugins/colorscheme.lua
#   - este archivo

# Paleta paper:
#   bg          #f5ead0   cream papel
#   bg_dark     #ede0c2   cream un poco más sucio
#   bg_border   #d4c298   selection bg (cream tostado)
#   fg          #2a1f15   tinta sepia
#   fg_dim      #5a4830   fg apagado pero legible
#   tierra      #b0a280   bright_black light — borders/inactive
#   coral       #d97757   Claude orange — cursor, acento principal
#   blue        #5a7a8e   azul humo
#   green       #6b8f4a   oliva
#   ámbar       #c08a1e   active window
#   red         #b8493a   terracota
#   magenta     #8a5a3f   marrón terracota

# ─── panes ────────────────────────────────────────────────────
set -g pane-border-style        "fg=#b0a280"
set -g pane-active-border-style "fg=#d97757"

# ─── messages / command line ──────────────────────────────────
set -g message-style         "fg=#2a1f15,bg=#d4c298,bold"
set -g message-command-style "fg=#2a1f15,bg=#d4c298"

# ─── copy mode ────────────────────────────────────────────────
set -g mode-style "fg=#f5ead0,bg=#c08a1e"   # selección en ámbar

# ─── pane numbers (display-panes) ─────────────────────────────
set -g display-panes-active-colour "#d97757"
set -g display-panes-colour        "#5a7a8e"

# ─── clock (prefix t) ─────────────────────────────────────────
set-window-option -g clock-mode-colour "#d97757"
