# ─── theme.conf — pane / message / mode structure ─────────────
# vim: ft=tmux
# STRUCTURE only. The colors come from tmux/themes/<id>.conf via the
# @thm_* user-options (sourced BEFORE this in tmux.conf). `set -gF` bakes
# the variable's current value at source time — that's why this
# file goes AFTER the palette. Changing theme = pointing the `source`
# of the palette in tmux.conf at another themes/<id>.conf, never this file.
#
# Available roles: @thm_bg @thm_bg_sel @thm_fg @thm_dim @thm_subtle
#                  @thm_accent @thm_active @thm_blue

# ─── panes ────────────────────────────────────────────────────
set -gF pane-border-style        "fg=#{@thm_subtle}"
set -gF pane-active-border-style "fg=#{@thm_accent}"

# ─── popups (display-popup) ───────────────────────────────────
# Frame of the floating overlays (Alt+c/Alt+C Claude, Alt+y/Alt+u from the
# plugin, etc.). Popups used to go with `-B` (no border) and at 90% they
# looked like they were floating with no definition. `popup-border-lines` is structure (not
# color) → set -g; the color IS a style → set -gF. It uses @thm_subtle (each
# theme's gray/comment), not @thm_accent — the strong accent is reserved for the
# active pane; the popup frame is more discreet. Rounded border, craftzdog
# style.
set -g  popup-border-lines rounded
set -gF popup-border-style "fg=#{@thm_subtle}"

# ─── messages / command line ──────────────────────────────────
set -gF message-style         "fg=#{@thm_fg},bg=#{@thm_bg_sel},bold"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_bg_sel}"

# ─── copy mode ────────────────────────────────────────────────
# Selection over the "active" accent (amber/violet depending on the theme).
set -gF mode-style "fg=#{@thm_bg},bg=#{@thm_active}"

# ─── pane numbers (display-panes) ─────────────────────────────
set -gF display-panes-active-colour "#{@thm_accent}"
set -gF display-panes-colour        "#{@thm_blue}"

# ─── clock (prefix t) ─────────────────────────────────────────
setw -gF clock-mode-colour "#{@thm_accent}"
