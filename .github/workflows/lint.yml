# Static checks only — nothing here installs the dotfiles or needs a Mac.
# Everything that runs is a syntax/lint pass over the files a `git pull`
# delivers, so a typo in an installer or a zsh file is caught before it lands
# on the other machines. Runtime validation stays where it always was: running
# the installer (CLAUDE.md, "there is no test suite").
#
# tmux and nvim configs are NOT parsed here on purpose: both need their
# plugins present to load, and stubbing those out tests the stub, not the
# config. tmux is validated by the installer's `tmux source-file` reload.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # shellcheck ships preinstalled on ubuntu runners; .shellcheckrc at the
      # repo root carries the config (external-sources, the two disables).
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x \
            install.sh install-linux.sh \
            scripts/lib.sh scripts/ide scripts/claude-api-env scripts/theme \
            claude/install/*.sh plugins/logbook/hooks/logbook.sh claude/statusline.sh

      # Every loop here collects failures in $failed and exits on it. A plain
      # `check "$f" && echo ok` does NOT fail the step: the runner's `bash -e`
      # ignores a failure on the left of `&&`, and the loop then exits with
      # the LAST file's status — so a broken file anywhere but last goes green.
      - name: bash -n
        run: |
          failed=0
          for f in install.sh install-linux.sh scripts/lib.sh scripts/ide \
                   scripts/claude-api-env scripts/theme claude/install/*.sh \
                   plugins/logbook/hooks/logbook.sh claude/statusline.sh; do
            if bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

      # With no argument scripts/theme only reads: it prints the id each layer
      # selects and exits 1 when ghostty, nvim and tmux disagree.
      - name: stack theme in sync
        run: scripts/theme

      - name: zsh -n
        run: |
          sudo apt-get install -y -q zsh >/dev/null
          failed=0
          for f in zsh/.zshenv zsh/.zshrc zsh/functions.zsh; do
            if zsh -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

  lua-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Syntax only (luac -p): nvim's runtime globals (`vim.*`) don't exist
      # outside the editor, so nothing is executed.
      - name: luac -p
        run: |
          sudo apt-get install -y -q lua5.1 >/dev/null
          find nvim -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          echo "ok  $(find nvim -name '*.lua' | wc -l) lua files"

      # Same $failed pattern as the shell job, for the same reason.
      - name: jq (json validity)
        run: |
          failed=0
          for f in claude/install/permissions.json nvim/lazy-lock.json \
                   plugins/logbook/.claude-plugin/plugin.json plugins/logbook/plugin.json \
                   claude/themes/*.json; do
            if jq empty "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Parse only — PowerShell's own parser, no execution. Catches the
      # unbalanced-brace / bad-token class of error in the Windows installer,
      # which otherwise only surfaces on a Windows box.
      # install-windows.ps1 replicates claude/install/settings.sh by hand and
      # nothing else keeps them in sync (CLAUDE.md admits it). This catches the
      # cheapest drift: a settings.json key that settings.sh writes and the
      # Windows script never mentions. Keys that DIVERGE ON PURPOSE go in the
      # allowlist below, each with its reason written next to the Windows block.
      - name: settings.sh ↔ install-windows.ps1 mirror
        shell: bash
        run: |
          allow='terminalTitleFromRename'   # tmux owns the tab title on mac/Linux; no tmux on Windows
          missing=0
          # The class carries `_` for the env.CLAUDE_CODE_* keys: without it the
          # pattern simply fails to match those lines and they go unchecked —
          # a silent hole, not a failure.
          for key in $(grep -oE "_settings_set_if_absent +'\.[A-Za-z._]+'" claude/install/settings.sh \
                       | sed -E "s/.*'\.([A-Za-z._]+)'/\1/" | awk -F. '{print $NF}' | sort -u); do
            # Quoted, so a key named in a comment does not count as mirrored.
            if grep -q "\"$key\"" install-windows.ps1; then echo "ok    $key"
            elif grep -qw "$key" <<<"$allow"; then echo "skip  $key (documented divergence)"
            else echo "MISSING in install-windows.ps1: $key"; missing=1; fi
          done
          exit $missing

      - name: pwsh parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('install-windows.ps1', 'claude/statusline.ps1', 'plugins/logbook/hooks/logbook.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            # ${f} — a bare `$f:` is read as a drive/scope qualifier and fails to parse.
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Host "${f}: $($_.Message)" } }
            else { Write-Host "ok  $f" }
          }
          if ($failed) { exit 1 }
