# Static checks only — nothing here installs the dotfiles or needs a Mac.
# Everything that runs is a syntax/lint pass over the files a `git pull`
# delivers, a few text comparisons between files that are kept in sync by hand,
# and one smoke test for a hook that fails silently by design, so a typo in an
# installer or a zsh file is caught before it lands on the other machines.
# Runtime validation stays where it always was: running the installer
# (CLAUDE.md, "there is no test suite").
#
# The nvim config is NOT parsed here on purpose: it needs its plugins present
# to load, and stubbing those out tests the stub, not the config.
name: lint

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the checkout; the default token can also write.
permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # shellcheck ships preinstalled on ubuntu runners; .shellcheckrc at the
      # repo root carries the config (external-sources, the two disables).
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x \
            install.sh install-linux.sh \
            scripts/lib.sh scripts/claude-api-env scripts/theme \
            claude/install/*.sh plugins/logbook/hooks/logbook.sh claude/statusline.sh

      # Every loop here collects failures in $failed and exits on it. A plain
      # `check "$f" && echo ok` does NOT fail the step: the runner's `bash -e`
      # ignores a failure on the left of `&&`, and the loop then exits with
      # the LAST file's status — so a broken file anywhere but last goes green.
      - name: bash -n
        run: |
          failed=0
          for f in install.sh install-linux.sh scripts/lib.sh \
                   scripts/claude-api-env scripts/theme claude/install/*.sh \
                   plugins/logbook/hooks/logbook.sh claude/statusline.sh; do
            if bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

      # With no argument scripts/theme only reads: it prints the id each layer
      # selects and exits 1 when ghostty and nvim disagree.
      - name: stack theme in sync
        run: scripts/theme

      # A theme is its two definitions (CLAUDE.md), so each must have the other.
      # ghostty → nvim goes through scripts/theme's own valid_id (--list prints
      # exactly the ids that pass it) rather than restating the rule here; ids
      # are matched as any field of a line, not by column, so the mark column can
      # change. --list is captured on its own line because the step's `bash -e`
      # has no pipefail, and a crash inside a pipe would go unnoticed.
      # valid_id lets solarized-osaka through with no nvim theme module because
      # nvim renders it through its plugin spec, and does not check that the spec
      # exists; so that is checked here.
      # nvim/lua/themes/_*.lua are shared helpers (_base.lua), not themes.
      - name: every theme has both definitions
        run: |
          listed=$(scripts/theme --list)
          failed=0
          for f in ghostty/themes/*; do
            id=$(basename "$f")
            [ "$id" = README.md ] && continue
            if awk -v id="$id" '{ for (i = 1; i <= NF; i++) if ($i == id) found = 1 } END { exit !found }' <<<"$listed"; then
              echo "ok    $id"
            else echo "FAIL  $id: not selectable, nvim/lua/themes/$id.lua is missing"; failed=1; fi
          done
          if [ -f ghostty/themes/solarized-osaka ] && [ ! -f nvim/lua/plugins/solarized-osaka.lua ]; then
            echo "FAIL  solarized-osaka: nvim/lua/plugins/solarized-osaka.lua is missing"; failed=1
          fi
          for f in nvim/lua/themes/*.lua; do
            id=$(basename "$f" .lua)
            case $id in _*) continue ;; esac
            if [ ! -f "ghostty/themes/$id" ]; then
              echo "FAIL  $id: nvim/lua/themes/$id.lua has no ghostty/themes/$id"; failed=1
            fi
          done
          exit $failed

      # logbook.sh and logbook.ps1 are hand-kept twins that must hand the model
      # the same reminder. The literal is found by the skill it names rather than
      # by the code around it, so reworking either hook's plumbing keeps the
      # check working. Each file is read with its own quoting: in the .sh the
      # literal is a JSON string inside a single-quoted jq program (\" and '\''),
      # in the .ps1 a single-quoted string ('').
      # The .ps1 spells the dash as an ASCII "-" where the .sh has an em dash on
      # purpose: Windows PowerShell 5.1 reads a BOM-less script as cp1252 and
      # would mangle it. So only the .sh side is folded, and the .ps1 literal
      # must be plain ASCII.
      - name: logbook reminder, .sh ↔ .ps1
        run: |
          literal() {
            local hits
            hits=$(grep -oE "$2" "$1" || true)
            if [ "$(grep -c . <<<"$hits")" -ne 1 ]; then
              echo "FAIL  $1: expected exactly one quoted string naming logbook:entry, found: ${hits:-none}" >&2
              return 1
            fi
            printf '%s\n' "${hits:1:${#hits}-2}"
          }
          sh=$(literal plugins/logbook/hooks/logbook.sh '"([^"\\]|\\.)*logbook:entry([^"\\]|\\.)*"')
          ps=$(literal plugins/logbook/hooks/logbook.ps1 "'([^']|'')*logbook:entry([^']|'')*'")
          sh=$(sed -e "s/'\\\\''/'/g" -e 's/\\"/"/g' -e 's/—/-/g' <<<"$sh")
          ps=${ps//\'\'/\'}
          if LC_ALL=C grep -q '[^ -~]' <<<"$ps"; then
            echo "FAIL  plugins/logbook/hooks/logbook.ps1: the reminder has a non-ASCII character, which PowerShell 5.1 mangles"
            exit 1
          fi
          if [ "$sh" = "$ps" ]; then echo "ok    reminders match"
          else
            echo "FAIL  the two reminders differ (.sh <, .ps1 >):"
            diff <(echo "$sh") <(echo "$ps") || true
            exit 1
          fi

      - name: zsh -n
        run: |
          sudo apt-get install -y -q zsh >/dev/null
          failed=0
          for f in zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/path.zsh zsh/functions.zsh; do
            if zsh -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

  lua-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Syntax only (luac -p): nvim's runtime globals (`vim.*`) don't exist
      # outside the editor, so nothing is executed.
      - name: luac -p
        run: |
          sudo apt-get install -y -q lua5.1 >/dev/null
          find nvim -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          echo "ok  $(find nvim -name '*.lua' | wc -l) lua files"

      # Same $failed pattern as the shell job, for the same reason.
      - name: jq (json validity)
        run: |
          failed=0
          for f in claude/install/permissions.json nvim/lazy-lock.json \
                   plugins/logbook/.claude-plugin/plugin.json plugins/logbook/plugin.json \
                   claude/themes/*.json; do
            if jq empty "$f"; then echo "ok    $f"; else echo "FAIL  $f"; failed=1; fi
          done
          exit $failed

      # The logbook plugin carries two manifests for the same plugin, kept in
      # sync by hand. A version bumped in one only ships a plugin that reports
      # two different versions depending on the host that loads it.
      - name: logbook manifests agree
        run: |
          fields='{name, version, description, author}'
          if diff <(jq -S "$fields" plugins/logbook/.claude-plugin/plugin.json) \
                  <(jq -S "$fields" plugins/logbook/plugin.json); then
            echo "ok    name, version, description, author"
          else
            echo "FAIL  plugins/logbook/.claude-plugin/plugin.json (<) and plugins/logbook/plugin.json (>) disagree"
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The hooks run on the Mac's /usr/bin/python3, which is 3.9. The runner's is
      # newer, so the grammar is pinned to 3.9: syntax from a later release would
      # otherwise pass here and fail on every Bash call there.
      - name: python parse (3.9 grammar)
        run: |
          python3 - claude/hooks/*.py <<'PY'
          import ast, sys
          failed = 0
          for f in sys.argv[1:]:
              try:
                  ast.parse(open(f).read(), f, feature_version=(3, 9))
                  print(f"ok    {f}")
              except SyntaxError as e:
                  print(f"FAIL  {f}: {e}")
                  failed = 1
          sys.exit(failed)
          PY

      # no-bash-edits exits 0 silently on ANY exception, by design (a bug must
      # never block a command), so a broken hook looks exactly like one that
      # allows everything. One deny and one allow case tell the two apart.
      - name: no-bash-edits smoke test
        run: |
          hook=claude/hooks/no-bash-edits.py
          deny=$(jq -nc '{tool_name: "Bash", tool_input: {command: "sed -i s/a/b/ f.txt"}}' | python3 "$hook")
          allow=$(jq -nc '{tool_name: "Bash", tool_input: {command: "echo x > /dev/null"}}' | python3 "$hook")
          if ! jq -e '.hookSpecificOutput.permissionDecision == "deny"' <<<"$deny" >/dev/null; then
            echo "FAIL  deny case produced: ${deny:-<nothing>}"; exit 1
          fi
          if [ -n "$allow" ]; then echo "FAIL  allow case produced: $allow"; exit 1; fi
          echo "ok    deny + allow"

  powershell:
    runs-on: ubuntu-latest
    # One list for both pwsh steps, so a script cannot be parsed but not analyzed.
    env:
      PS_SCRIPTS: install-windows.ps1 claude/statusline.ps1 plugins/logbook/hooks/logbook.ps1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # install-windows.ps1 replicates claude/install/settings.sh by hand and
      # nothing else keeps them in sync (CLAUDE.md admits it). This catches the
      # cheapest drift: a settings.json key that settings.sh writes and the
      # Windows script never mentions. Keys that DIVERGE ON PURPOSE go in the
      # allowlist below, each with its reason written next to the Windows block.
      - name: settings.sh ↔ install-windows.ps1 mirror
        shell: bash
        run: |
          allow=''
          missing=0
          # The class carries `_` for the env.CLAUDE_CODE_* keys: without it the
          # pattern simply fails to match those lines and they go unchecked —
          # a silent hole, not a failure.
          for key in $(grep -oE "_settings_set_if_absent +'\.[A-Za-z._]+'" claude/install/settings.sh \
                       | sed -E "s/.*'\.([A-Za-z._]+)'/\1/" | awk -F. '{print $NF}' | sort -u); do
            # Quoted, so a key named in a comment does not count as mirrored.
            if grep -q "\"$key\"" install-windows.ps1; then echo "ok    $key"
            elif grep -qw "$key" <<<"$allow"; then echo "skip  $key (documented divergence)"
            else echo "MISSING in install-windows.ps1: $key"; missing=1; fi
          done
          exit $missing

      # Parse only — PowerShell's own parser, no execution. Catches the
      # unbalanced-brace / bad-token class of error in the Windows scripts,
      # which otherwise only surfaces on a Windows box.
      - name: pwsh parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in $env:PS_SCRIPTS -split ' ') {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            # ${f} — a bare `$f:` is read as a drive/scope qualifier and fails to parse.
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Host "${f}: $($_.Message)" } }
            else { Write-Host "ok  $f" }
          }
          if ($failed) { exit 1 }

      # Static analysis, still no execution. Error severity only: the gate is
      # the defect class (reserved names, assignments to automatic variables,
      # plain-text credentials), not the Warning-level style rules.
      # PSScriptAnalyzer ships on the ubuntu image; the install is a fallback,
      # pinned like the actions so a new release cannot move the gate unseen.
      - name: PSScriptAnalyzer (errors)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          $failed = $false
          foreach ($f in $env:PS_SCRIPTS -split ' ') {
            $found = @(Invoke-ScriptAnalyzer -Path $f -Severity Error)
            if ($found.Count -gt 0) {
              $failed = $true
              $found | ForEach-Object { Write-Host "${f}:$($_.Line): $($_.RuleName): $($_.Message)" }
            }
            else { Write-Host "ok  $f" }
          }
          if ($failed) { exit 1 }
