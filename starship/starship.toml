# ═══════════════════════════════════════════════════════════════
#  Starship — ultra-minimal one-liner, theme-portable via ANSI.
#  The styles use names (red, cyan, bright-black…) instead of hex,
#  so the prompt adapts automatically to Ghostty's active theme.
#
#  Philosophy: the terminal's width belongs to the command, not the prompt.
#  Only what contributes NOW is shown: dir always, git branch in repos,
#  duration if it took a while, and the λ char that already signals
#  success/error by color. Everything else (git counts, clock, runtime
#  versions) is intentionally off — if you want it one day, flip the flag.
#
#  Slot → palette[N] mapping of the theme:
#    bright-black (8) = subtle (hostname/user SSH)
#    blue (4)         = directory (main accent)
#    yellow (3)       = git branch + git status
#    purple (5)       = prompt OK (= magenta; matches the theme's cursor, #d23681 in osaka)
#    red (1)          = prompt error
#    cyan (6)         = prompt in vi normal mode
#    bright-yellow    = cmd duration (only if > 2s)
#
#  100% ANSI, no hex exceptions: the whole prompt follows the stack's
#  theme (Ghostty's `theme =`). In osaka the slots land on cold solarized.
# ═══════════════════════════════════════════════════════════════

add_newline = false
command_timeout = 1000

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

# ─── prompt char (λ, color = state) ───────────────────────────
# The λ's color is all the exit-code signal you need:
# purple = last command OK, red = it failed. That's why $status is off.
# WATCH OUT: starship calls ANSI 5 `purple` (what the rest of the world calls
# magenta) — the name `magenta` does NOT exist in starship, it falls back to
# default with no color. `purple` is ANSI (not hex): in osaka slot 5 is #d23681 —
# the SAME color as Ghostty's cursor, tmux's accent and incline's indicator.
# The whole stack coordinates there. In another theme, the λ takes THAT theme's slot 5.
[character]
success_symbol = "[λ](purple)"
error_symbol   = "[λ](red)"
vimcmd_symbol  = "[λ](cyan)"

# ─── exit status (off — the λ's color already says it) ─────────
[status]
disabled = true

# ─── user / hostname (only over SSH) ───────────────────────────
# Local terminal: both hidden. Over SSH they show up so you know at a
# glance that you're not on your own machine — that DOES contribute.
[username]
show_always = false
style_user  = "bright-black"
style_root  = "bold red"
format      = "[$user]($style)@"

[hostname]
ssh_only  = true
trim_at   = "."
style     = "bright-black"
format    = "[$hostname]($style) "

# ─── directory (main accent, always visible) ───────────────────
[directory]
# blue (ANSI) — follows the stack's theme: in osaka it lands on solarized blue
# (#268bd3, almost the same one craftzdog uses for his git segment). It used to
# be a fixed earth hex that clashed with osaka's cold background.
style              = "bold blue"
truncation_length  = 3
truncate_to_repo   = true
truncation_symbol  = "…/"
read_only          = " "
read_only_style    = "red"
format             = "[$path]($style)[$read_only]($read_only_style) "

# ─── git branch (only inside a repo) ───────────────────────────
[git_branch]
symbol = " "
style  = "yellow"
format = "[$symbol$branch]($style) "

# ─── git status (terse symbols, a "craftzdog" touch) ──────────
# Flat, a single line: the branch already comes in yellow, the status
# accompanies it with compact symbols + counts. The outer `( … )` group
# is a starship conditional: with a clean repo it renders NOTHING (not even
# a stray space); it only shows up when there's something to report.
# Style in yellow (ANSI name, not hex) → follows the stack's theme like
# the rest of the prompt. Symbols: ✚ staged · ! modified · ? untracked
# · * stash · = conflict · ⇡ ahead · ⇣ behind.
[git_status]
disabled    = false
style       = "yellow"
format      = "([$all_status$ahead_behind]($style) )"
staged      = "✚${count}"
modified    = "!${count}"
untracked   = "?${count}"
stashed     = "*${count}"
conflicted  = "=${count}"
deleted     = "✘${count}"
renamed     = "»${count}"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇡${ahead_count}⇣${behind_count}"
up_to_date  = ""

# git metrics (+/- lines) off — too much noise for a one-liner.
[git_metrics]
disabled = true

# ─── runtimes (off for minimalism — `node -v` / `python -V` ────
# when you need it. Set disabled = false to re-enable them).
[python]
disabled = true

[nodejs]
disabled = true

# ─── cmd duration (only if it took >2s — pure useful feedback) ─
[cmd_duration]
min_time = 2000
style    = "bright-yellow"
format   = "[$duration ]($style)"

# ─── right-side clock (off — minimal; you have the OS bar) ─────
[time]
disabled = true
