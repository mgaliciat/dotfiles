# ═══════════════════════════════════════════════════════════════
#  Starship — Anthropic Warm palette
#  Acentos: #d97757 (Claude orange), #87a96b (oliva), #c8553d (terracota)
#  Filosofía: dos líneas, info útil al vuelo, cero distracción.
# ═══════════════════════════════════════════════════════════════

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"

# ─── prompt char ──────────────────────────────────────────────
[character]
success_symbol = "[❯](#d97757)"
error_symbol = "[❯](#c8553d)"
vimcmd_symbol = "[❮](#87a96b)"

# ─── directorio ───────────────────────────────────────────────
[directory]
style = "bold #d97757"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"

# ─── git ──────────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "#b08968"
format = "[on ](dimmed #b08968)[$branch]($style) "

[git_status]
style = "#c8553d"
format = "[$all_status$ahead_behind]($style)"
conflicted = "✘ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "⇕${ahead_count}/${behind_count} "
modified = "● "
staged = "+ "
untracked = "? "
stashed = "≡ "
renamed = "» "
deleted = "✘ "

# ─── lenguajes ────────────────────────────────────────────────
[python]
symbol = "py "
style = "#87a96b"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[nodejs]
symbol = "node "
style = "#8aa9a1"
format = "[${symbol}(${version} )]($style)"
detect_files = ["package.json", ".nvmrc"]

# ─── cmd duration (solo si tardó >2s) ─────────────────────────
[cmd_duration]
min_time = 2000
style = "bold #d9a441"
format = "took [$duration]($style) "

# ─── reloj (esquina derecha) ──────────────────────────────────
[time]
disabled = false
time_format = "%H:%M"
style = "#4a3f33"
format = "[$time]($style)"
