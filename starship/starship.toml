# ═══════════════════════════════════════════════════════════════
#  Starship — theme-portable via colores ANSI
#  Los styles usan nombres (red, cyan, bright-black…) en vez de hex,
#  así el prompt se adapta automáticamente al theme activo de Ghostty.
#  Mapeo del slot → palette[N] del theme:
#    bright-black (8) = tono "muted" para brackets/separadores
#    blue (4)         = identidad (user/host)
#    bright-blue (12) = directorio (acento principal)
#    yellow (3)       = git branch
#    red (1)          = git status / errores
#    green (2)        = python / OK prompt
#    cyan (6)         = nodejs
#    bright-yellow    = cmd duration (warning)
#  Filosofía: dos líneas, info útil al vuelo, cero distracción.
# ═══════════════════════════════════════════════════════════════

add_newline = true
command_timeout = 1000

format = """
[\\[](bright-black)$username[@](bright-black)$hostname[ ](bright-black)$directory[\\] ](bright-black)\
$git_branch\
$git_status\
$python\
$nodejs\
$cmd_duration\
$line_break\
$status\
$character"""

right_format = "$time"

# ─── prompt char ──────────────────────────────────────────────
[character]
success_symbol = "[\\$](green)"
error_symbol = "[\\$](red)"
vimcmd_symbol = "[:](cyan)"

# ─── exit status (en su propia línea si != 0) ─────────────────
[status]
disabled = false
format = "[\\[exit $status\\]](red)\n"

# ─── user / host ──────────────────────────────────────────────
[username]
show_always = true
style_user = "blue"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = "."
style = "blue"
format = "[$hostname]($style)"

# ─── directorio ───────────────────────────────────────────────
[directory]
style = "bold bright-blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"

# ─── git ──────────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "yellow"
format = '[\(](bright-black)[$branch]($style)[\) ](bright-black)'

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style)"
conflicted = "✘ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "⇕${ahead_count}/${behind_count} "
modified = "● "
staged = "+ "
untracked = "? "
stashed = "≡ "
renamed = "» "
deleted = "✘ "

# ─── lenguajes ────────────────────────────────────────────────
[python]
symbol = "py "
style = "green"
format = '[\[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))\] ]($style)'
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[nodejs]
symbol = "node "
style = "cyan"
format = '[\[${symbol}(${version})\] ]($style)'
detect_files = ["package.json", ".nvmrc"]

# ─── cmd duration (solo si tardó >2s) ─────────────────────────
[cmd_duration]
min_time = 2000
style = "bold bright-yellow"
format = '[\[$duration\] ]($style)'

# ─── reloj (esquina derecha) ──────────────────────────────────
[time]
disabled = false
time_format = "%H:%M"
style = "bright-black"
format = "[$time]($style)"
