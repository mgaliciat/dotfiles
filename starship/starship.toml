# ═══════════════════════════════════════════════════════════════
#  Starship — ultra-minimal one-liner, theme-portable via ANSI.
#  Los styles usan nombres (red, cyan, bright-black…) en vez de hex,
#  así el prompt se adapta automáticamente al theme activo de Ghostty.
#
#  Filosofía: el ancho de la terminal es del comando, no del prompt.
#  Solo se muestra lo que aporta AHORA: dir siempre, git branch en
#  repos, duración si tardó, y el char λ que ya señala éxito/error
#  por color. Lo demás (counts de git, reloj, versiones de runtime)
#  está intencionalmente apagado — si lo querés un día, flip el flag.
#
#  Mapeo del slot → palette[N] del theme:
#    bright-black (8) = subtle (hostname/user SSH)
#    #b08968 (hex)    = directorio (acento principal, tierra)
#    yellow (3)       = git branch
#    #d97757 (hex)    = prompt OK (Claude orange, matchea cursor)
#    red (1)          = prompt error
#    cyan (6)         = prompt en vi normal mode
#    bright-yellow    = cmd duration (solo si > 2s)
# ═══════════════════════════════════════════════════════════════

add_newline = false
command_timeout = 1000

format = """\
$username\
$hostname\
$directory\
$git_branch\
$cmd_duration\
$character"""

# ─── prompt char (λ, color = estado) ──────────────────────────
# El color del λ es toda la señal de exit code que necesitás:
# Claude orange = último comando OK (matchea el cursor), rojo = falló.
# Por eso $status va off. Excepción a la regla "solo ANSI" del header:
# el orange es hex fijo a propósito, para igualar el cursor del theme.
[character]
success_symbol = "[λ](#d97757)"
error_symbol   = "[λ](red)"
vimcmd_symbol  = "[λ](cyan)"

# ─── exit status (off — el color del λ ya lo dice) ─────────────
[status]
disabled = true

# ─── user / hostname (sólo en SSH) ─────────────────────────────
# Local terminal: ambos ocultos. En SSH aparecen para que sepas
# de un vistazo que no estás en tu máquina — eso SÍ aporta.
[username]
show_always = false
style_user  = "bright-black"
style_root  = "bold red"
format      = "[$user]($style)@"

[hostname]
ssh_only  = true
trim_at   = "."
style     = "bright-black"
format    = "[$hostname]($style) "

# ─── directorio (acento principal, siempre visible) ────────────
[directory]
# Hex fijo (tierra de la paleta) — excepción a la regla "solo ANSI" del
# header, igual que el λ orange: acento cálido constante entre themes.
style              = "bold #b08968"
truncation_length  = 3
truncate_to_repo   = true
truncation_symbol  = "…/"
read_only          = " "
read_only_style    = "red"
format             = "[$path]($style)[$read_only]($read_only_style) "

# ─── git branch (sólo dentro de un repo) ───────────────────────
[git_branch]
symbol = " "
style  = "yellow"
format = "[$symbol$branch]($style) "

# ─── git status / metrics (off — corré `git status` si querés ──
# el detalle; el prompt no acarrea counts en cada render).
[git_status]
disabled = true

[git_metrics]
disabled = true

# ─── runtimes (off por minimalismo — `node -v` / `python -V` ───
# cuando lo necesites. Poné disabled = false para re-activarlos).
[python]
disabled = true

[nodejs]
disabled = true

# ─── cmd duration (sólo si tardó >2s — puro feedback útil) ─────
[cmd_duration]
min_time = 2000
style    = "bright-yellow"
format   = "[$duration ]($style)"

# ─── reloj derecho (off — minimal; tenés la barra del SO) ──────
[time]
disabled = true
