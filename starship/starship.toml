# ═══════════════════════════════════════════════════════════════
#  Starship — ultra-minimal one-liner, theme-portable via ANSI.
#  Los styles usan nombres (red, cyan, bright-black…) en vez de hex,
#  así el prompt se adapta automáticamente al theme activo de Ghostty.
#
#  Filosofía: el ancho de la terminal es del comando, no del prompt.
#  Solo se muestra lo que aporta AHORA: dir siempre, git branch en
#  repos, duración si tardó, y el char λ que ya señala éxito/error
#  por color. Lo demás (counts de git, reloj, versiones de runtime)
#  está intencionalmente apagado — si lo querés un día, flip el flag.
#
#  Mapeo del slot → palette[N] del theme:
#    bright-black (8) = subtle (hostname/user SSH)
#    blue (4)         = directorio (acento principal)
#    yellow (3)       = git branch + git status
#    purple (5)       = prompt OK (= magenta; matchea el cursor del tema, en osaka #d23681)
#    red (1)          = prompt error
#    cyan (6)         = prompt en vi normal mode
#    bright-yellow    = cmd duration (solo si > 2s)
#
#  100% ANSI, sin excepciones hex: el prompt entero sigue el tema del
#  stack (scripts/theme). En osaka los slots caen en solarized frío.
# ═══════════════════════════════════════════════════════════════

add_newline = false
command_timeout = 1000

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

# ─── prompt char (λ, color = estado) ──────────────────────────
# El color del λ es toda la señal de exit code que necesitás:
# purple = último comando OK, rojo = falló. Por eso $status va off.
# OJO: starship llama `purple` al ANSI 5 (lo que el resto del mundo llama
# magenta) — NO existe el nombre `magenta` en starship, cae a default sin
# color. `purple` es ANSI (no hex): en osaka el slot 5 es #d23681 — el MISMO
# color que el cursor de Ghostty, el acento de tmux y el indicador de incline.
# Todo el stack coordina ahí. En otro tema, la λ toma el slot 5 de ESE tema.
[character]
success_symbol = "[λ](purple)"
error_symbol   = "[λ](red)"
vimcmd_symbol  = "[λ](cyan)"

# ─── exit status (off — el color del λ ya lo dice) ─────────────
[status]
disabled = true

# ─── user / hostname (sólo en SSH) ─────────────────────────────
# Local terminal: ambos ocultos. En SSH aparecen para que sepas
# de un vistazo que no estás en tu máquina — eso SÍ aporta.
[username]
show_always = false
style_user  = "bright-black"
style_root  = "bold red"
format      = "[$user]($style)@"

[hostname]
ssh_only  = true
trim_at   = "."
style     = "bright-black"
format    = "[$hostname]($style) "

# ─── directorio (acento principal, siempre visible) ────────────
[directory]
# blue (ANSI) — sigue el tema del stack: en osaka cae en el azul solarized
# (#268bd3, casi el mismo que usa craftzdog para su segmento git). Antes era
# un hex tierra fijo que desentonaba sobre el fondo frío del osaka.
style              = "bold blue"
truncation_length  = 3
truncate_to_repo   = true
truncation_symbol  = "…/"
read_only          = " "
read_only_style    = "red"
format             = "[$path]($style)[$read_only]($read_only_style) "

# ─── git branch (sólo dentro de un repo) ───────────────────────
[git_branch]
symbol = " "
style  = "yellow"
format = "[$symbol$branch]($style) "

# ─── git status (símbolos terse, un toque "craftzdog") ────────
# Flat, una sola línea: el branch ya viene en yellow, el status lo
# acompaña con símbolos compactos + counts. El grupo `( … )` externo
# es condicional de starship: con repo limpio NO renderiza nada (ni un
# espacio sobrante); solo aparece cuando hay algo que reportar.
# Style en yellow (nombre ANSI, no hex) → sigue el tema del stack como
# el resto del prompt. Símbolos: ✚ staged · ! modificado · ? untracked
# · * stash · = conflicto · ⇡ ahead · ⇣ behind.
[git_status]
disabled    = false
style       = "yellow"
format      = "([$all_status$ahead_behind]($style) )"
staged      = "✚${count}"
modified    = "!${count}"
untracked   = "?${count}"
stashed     = "*${count}"
conflicted  = "=${count}"
deleted     = "✘${count}"
renamed     = "»${count}"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇡${ahead_count}⇣${behind_count}"
up_to_date  = ""

# git metrics (líneas +/-) off — demasiado ruido para un one-liner.
[git_metrics]
disabled = true

# ─── runtimes (off por minimalismo — `node -v` / `python -V` ───
# cuando lo necesites. Poné disabled = false para re-activarlos).
[python]
disabled = true

[nodejs]
disabled = true

# ─── cmd duration (sólo si tardó >2s — puro feedback útil) ─────
[cmd_duration]
min_time = 2000
style    = "bright-yellow"
format   = "[$duration ]($style)"

# ─── reloj derecho (off — minimal; tenés la barra del SO) ──────
[time]
disabled = true
