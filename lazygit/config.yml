# ─── lazygit config ───────────────────────────────────────────
# Versioned in dotfiles. Symlink: ~/.config/lazygit/config.yml.
# Full docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Mouse off: in tmux popups the mouse sometimes does weird things
  # (Ghostty's selection interferes with lazygit's clicks).
  mouseEvents: false
  # Hand-mirror of the ACTIVE stack theme (`typesafe`, see
  # ghostty/themes/typesafe). Both entry points — the tmux popup (Alt+g)
  # and the nvim float (snacks, `configure = false` so it never overlays its own
  # theme) — read this file, so it paints the same in both. It is the one mirror
  # that does NOT follow the three selection lines on its own: when the stack
  # theme changes, re-copy the hex here. (It sat on solarized-osaka's hex
  # through two theme swaps; over the sage canvas that meant a #839395 default
  # text at 1.9:1 and a navy selection slab.)
  theme:
    activeBorderColor:
      - "#055c55" # ansi6 — the page teal darkened to read as a line, same as tmux's accent
      - bold
    inactiveBorderColor:
      - "#7d8c8b" # @thm_subtle — separators / borders
    optionsTextColor:
      - "#1b567f" # ansi4 blue
    selectedLineBgColor:
      - "#849090" # selection-background — the canvas one step darker
    cherryPickedCommitBgColor:
      - "#654c06" # ansi3
    cherryPickedCommitFgColor:
      - "#98a6a5" # the canvas
    unstagedChangesColor:
      - "#9c2339" # ansi1
    defaultFgColor:
      - "#000000" # ghostty's `foreground`
  # showFileTree: shows the change organized as a tree (default true).
  showFileTree: true
  showCommandLog: false # more room for the main panels
  showRandomTip: false # the status panel is for the repo, not for tips
  scrollHeight: 4 # smooth scroll
  sidePanelWidth: 0.3333 # 1/3 for the left panel (files/branches/etc)
  # The side panel you're IN takes 2× the space of the others: the commits
  # list gets subjects + authors when browsing history, and gives the room
  # back the moment focus moves to the diff. Off by default upstream because
  # the layout shifts on every panel jump; here that shift is the point.
  expandFocusedSidePanel: true
  # +N/-M per file in the files/commit-files views — tells you which file in a
  # commit is worth opening before you open it.
  showNumstatInFilesView: true
  showBranchCommitHash: true
  # `2` on the files panel cycles files → worktrees → submodules (same for
  # 3 branches/remotes/tags, 4 commits/reflog, 5 stash) instead of being a
  # no-op once you're already there. Saves reaching for `[` / `]`.
  switchTabsWithPanelJumpKeys: true
  # ↑N ↓M against the base branch in the branches panel.
  showDivergenceFromBaseBranch: arrowAndNumber
  # Nerd Font icons for files/branches/commits. Snacks sets the same value for
  # the nvim float; this is for the tmux popup, whose font is a NF too.
  nerdFontsVersion: "3"
git:
  # No `pull.mode` here: lazygit dropped the key and now honours git's own
  # `pull.rebase`. Rebase-by-default therefore lives in ~/.gitconfig (per-machine,
  # not versioned) — `git config --global pull.rebase true`. Putting it back
  # makes lazygit reject the whole file, not just the key.
  # Auto-fetch disabled (doesn't hang if the network is slow).
  autoFetch: false
  # Paginate diffs with delta if it's installed (you have it via brew).
  # `--light` travels with the hex above: delta's defaults for hunk backgrounds
  # and line numbers assume a dark canvas unless told, and it cannot detect one
  # here — lazygit captures its stdout, so the terminal query behind
  # `--detect-dark-light` has nothing to talk to. Flip it with the theme.
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light --syntax-theme=base16-256
# ─── custom commands ──────────────────────────────────────────
# `?` inside lazygit shows ALL the available shortcuts.
customCommands:
  # `A` in any pane → amend the last commit without editing the message.
  # Useful for "I forgot a file, let me add it to the previous commit".
  - key: "A"
    command: "git commit --amend --no-edit"
    context: "global"
    description: "Amend last commit without editing the message"
    loadingText: "Amending..."
  # `T` in files → see the current commit's tree with stat.
  - key: "T"
    command: "git log -1 --stat"
    context: "files"
    description: "Show stat of the last commit"
    output: terminal
